/* SMALL UI UPDATE ONLY */
.side:focus,
.qty:focus,
.merged-price:focus,

  outline: none !important;
  box-shadow: none !important;
}

/* Keep the original quantity stepper and input boxes; remove focus highlight only. */
.lot-stepper {
  display:flex !important;
  flex:0 0 25px;
  flex-direction:column;
  width:25px;
  height:30px;
  margin:0;
  padding:0;

<script>
"use strict";

let spanXML=null,contracts=[],portfolio=[];
let positionFileText="",positionRecords=[],positionMatched=[],positionUnmatched=[],positionClientIds=[];
let calendarSpreadDefinitions=[];

/* SPAN CACHE ONLY — keeps the last uploaded SPN/XML until a new SPAN upload. */
const SPAN_CACHE_DB="RS_SPAN_CACHE";
const SPAN_CACHE_STORE="span";
const SPAN_CACHE_KEY="latest";

function openSPANCache(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){resolve(null);return}
    const r=indexedDB.open(SPAN_CACHE_DB,1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(SPAN_CACHE_STORE))r.result.createObjectStore(SPAN_CACHE_STORE)};
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}
async function saveSPANCache(data){
  try{
    const db=await openSPANCache();if(!db)return;
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(SPAN_CACHE_STORE,"readwrite");
      tx.objectStore(SPAN_CACHE_STORE).put(data,SPAN_CACHE_KEY);
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
    db.close();
  }catch(e){console.warn("SPAN cache save failed:",e)}
}
async function loadSPANCache(){
  try{
    const db=await openSPANCache();if(!db)return null;
    const data=await new Promise((resolve,reject)=>{
      const tx=db.transaction(SPAN_CACHE_STORE,"readonly");
      const r=tx.objectStore(SPAN_CACHE_STORE).get(SPAN_CACHE_KEY);
      r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error);
    });
    db.close();return data;
  }catch(e){console.warn("SPAN cache load failed:",e);return null}
}
async function restoreSPANCache(){
  const data=await loadSPANCache();
  if(!data||!Array.isArray(data.contracts)||!data.contracts.length)return;
  contracts=data.contracts;
  calendarSpreadDefinitions=Array.isArray(data.defs)?data.defs:[];
  const name=String(data.fileName||"");
  if(name)document.getElementById("spanUploadedName").textContent=name;
  renderPortfolio();
  if(positionRecords.length)loadPositionFile();
}

function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function formatNumber(v){if(v===null||v===undefined||v==="")return "-";const n=Number(v);return Number.isFinite(n)?n.toLocaleString("en-IN",{maximumFractionDigits:6}):String(v)}
function normalizeExpiry(v){
 if(!v)return "";v=String(v).trim().toUpperCase();
 if(/^\d{8}$/.test(v))return v;if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v.replace(/-/g,"");
 const mths={JAN:"01",FEB:"02",MAR:"03",APR:"04",MAY:"05",JUN:"06",JUL:"07",AUG:"08",SEP:"09",OCT:"10",NOV:"11",DEC:"12"};
 let m=v.match(/^(\d{1,2})[-\/]([A-Z]{3})[-\/](\d{4})$/);if(m&&mths[m[2]])return m[3]+mths[m[2]]+String(m[1]).padStart(2,"0");
 m=v.match(/^(\d{1,2})([A-Z]{3})(\d{4})$/);if(m&&mths[m[2]])return m[3]+mths[m[2]]+String(m[1]).padStart(2,"0");
 return v;
}
function formatExpiry(v){const d=normalizeExpiry(v);if(!/^\d{8}$/.test(d))return v||"-";const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return d.slice(6,8)+"-"+m[Number(d.slice(4,6))-1]+"-"+d.slice(0,4)}
function setStatus(t,type){const e=document.getElementById("uploadStatus");if(e)e.textContent=""; if(type==="err") console.warn(t)}
function showSPANProgress(s=true){document.getElementById("spanProgress").style.display=s?"block":"none";document.getElementById("spanProgressText").style.display=s?"block":"none"}
function updateSPANProgress(p){p=Math.max(0,Math.min(100,Number(p)||0));document.getElementById("spanProgressBar").style.width=p+"%";document.getElementById("spanProgressText").textContent=Math.round(p)+"%"}
function hideSpanProgress(){showSPANProgress(false)}
function directValue(parent,tag){const n=parent?.querySelector(":scope > "+tag);return n?n.textContent.trim():""}
function directNumber(parent,tag){const v=directValue(parent,tag);if(v==="")return null;const n=Number(v);return Number.isFinite(n)?n:null}
function riskArray(node){const ra=node.querySelector(":scope > ra");if(!ra)return [];return Array.from(ra.querySelectorAll(":scope > a")).map(x=>{const n=Number(x.textContent.trim());return Number.isFinite(n)?n:0})}

/* Lot size: explicit SPN value first, then known NSE fallback. */
function getContractLotSize(node,pf,series,symbol){
 const tags=["lotSize","lotsize","lotSz","lot","lotQty","lotQtyVal","contractSize"];
 const attrs=["lotSize","lotsize","lotSz","lot","lotQty","contractSize"];
 function tag(p){if(!p)return null;for(const x of tags){const e=p.querySelector(":scope > "+x);if(e){const n=Number(e.textContent.trim());if(Number.isFinite(n)&&n>0)return n}}return null}
 function attr(p){if(!p)return null;for(const x of attrs){const v=p.getAttribute(x);if(v!==null){const n=Number(v);if(Number.isFinite(n)&&n>0)return n}}return null}
 const explicit=tag(node)??attr(node)??tag(series)??attr(series)??tag(pf)??attr(pf);
 if(Number.isFinite(explicit)&&explicit>0)return explicit;
 return 1;
}

   const blob=new Blob([workerCode],{type:'application/javascript'}),url=URL.createObjectURL(blob),worker=new Worker(url);
   worker.onmessage=e=>{const d=e.data||{};if(d.type==='progress'){updateSPANProgress(d.value);return}if(d.type==='need-main'){worker.terminate();URL.revokeObjectURL(url);resolve({fallbackMain:true});return}if(d.type==='error'){worker.terminate();URL.revokeObjectURL(url);reject(new Error(d.message));return}if(d.type==='done'){worker.terminate();URL.revokeObjectURL(url);resolve(d)}};
   worker.onerror=()=>{worker.terminate();URL.revokeObjectURL(url);reject(new Error('Fast SPAN parser failed.'))};
   worker.postMessage(file);
  }catch(err){reject(err)}
 });
}

function parseSPAN(onProgress){
    return new Promise((resolve,reject)=>{
        if(!spanXML){reject(new Error("SPN XML is not loaded."));return;}

        try{
            const doc=spanXML;
            const contractsOut=[];
            const seen=new Set();

            const direct=(parent,tag)=>{
                if(!parent) return "";
                for(const n of parent.children){
                    if(String(n.tagName).toLowerCase()===String(tag).toLowerCase()){
                        return (n.textContent||"").trim();
                    }
                }
                return "";
            };

            const num=(parent,tag)=>{
                const v=direct(parent,tag);
                if(v==="") return null;
                const n=Number(v);
                return Number.isFinite(n)?n:null;
            };

            const risk=(node)=>{
                for(const n of node.children){
                    if(String(n.tagName).toLowerCase()==="ra"){
                        const out=[];
                        for(const x of n.children){
                            if(String(x.tagName).toLowerCase()==="a"){
                                const z=Number((x.textContent||"").trim());
                                out.push(Number.isFinite(z)?z:0);
                            }
                        }
                        return out;
                    }
                }
                return [];
            };

            const firstD=(node)=>{
                for(const n of node.children){
                    if(String(n.tagName).toLowerCase()==="ra"){
                        for(const x of n.children){
                            if(String(x.tagName).toLowerCase()==="d"){
                                const z=Number((x.textContent||"").trim());
                                return Number.isFinite(z)?z:null;
                            }
                        }
                    }
                }
                return null;
            };

            const attr=(parent,names)=>{
                if(!parent)return null;
                for(const name of names){
                    const v=parent.getAttribute(name);
                    if(v!==null && v!==""){
                        const z=Number(v);
                        if(Number.isFinite(z)&&z>0)return z;
                    }
                }
                return null;
            };

            const tagNumber=(parent,names)=>{
                if(!parent)return null;
                for(const name of names){
                    for(const child of parent.children){
                        if(String(child.tagName).toLowerCase()===String(name).toLowerCase()){
                            const z=Number((child.textContent||"").trim());
                            if(Number.isFinite(z)&&z>0)return z;
                        }
                    }
                }
                return null;
            };

            const lot=(node,pf,series,symbol)=>{
                const names=["lotSize","lotsize","lotSz","lot","lotQty","lotQtyVal","contractSize"];
                const z=tagNumber(node,names)||attr(node,names)||tagNumber(series,names)||attr(series,names)||tagNumber(pf,names)||attr(pf,names);
                if(z&&z>0)return z;
                return 1;
            };

            const futPfs=Array.from(doc.querySelectorAll("futPf"));
            const optPfs=Array.from(doc.querySelectorAll("oopPf"));
            const totalGroups=futPfs.length+optPfs.length;
            let doneGroups=0;

            const progress=()=>{
                const value=totalGroups ? 35+(doneGroups/totalGroups)*65 : 100;
                if(onProgress)onProgress(Math.min(100,value));
            };

            // Parse in small batches so the browser remains responsive.
            const processFutures=(index)=>{
                const batchSize=(typeof document==="undefined")?100000:8;
                const end=Math.min(index+batchSize,futPfs.length);
                for(let i=index;i<end;i++){
                    const pf=futPfs[i];
                    const pfCode=direct(pf,"pfCode");
                    const pfId=direct(pf,"pfId");
                    const pfLot=lot(null,pf,null,pfCode);

                    for(const fut of pf.children){
                        if(String(fut.tagName).toLowerCase()!=="fut")continue;
                        const cId=direct(fut,"cId");
                        const expiry=direct(fut,"pe");
                        const key="FUT|"+pfId+"|"+cId+"|"+expiry;
                        if(seen.has(key))continue;
                        seen.add(key);

                        contractsOut.push({
                            type:"FUT",
                            pfCode,
                            pfId,
                            contractId:cId,
                            expiry,
                            strike:null,
                            optionType:"",
                            price:num(fut,"p"),
                            delta:num(fut,"d"),
                            spanDelta:firstD(fut),
                            volatility:num(fut,"v"),
                            cvf:num(fut,"cvf")??1,
                            scaling:num(fut,"sc")??1,
                            lotSize:lot(fut,pf,null,pfCode)||pfLot,
                            risk:risk(fut)
                        });
                    }
                    doneGroups++;
                }
                progress();
                if(index+batchSize<futPfs.length){
                    setTimeout(()=>processFutures(index+batchSize),0);
                }else{
                    setTimeout(()=>processOptions(0),0);
                }
            };

            const processOptions=(index)=>{
                const batchSize=(typeof document==="undefined")?100000:5;
                const end=Math.min(index+batchSize,optPfs.length);
                for(let i=index;i<end;i++){
                    const pf=optPfs[i];
                    const pfCode=direct(pf,"pfCode");
                    const pfId=direct(pf,"pfId");
                    const pfLot=lot(null,pf,null,pfCode);

                    for(const series of pf.children){
                        if(String(series.tagName).toLowerCase()!=="series")continue;
                        const expiry=direct(series,"pe");
                        const seriesLot=lot(null,pf,series,pfCode)||pfLot;

                        for(const opt of series.children){
                            if(String(opt.tagName).toLowerCase()!=="opt")continue;
                            const cId=direct(opt,"cId");
                            const ot=direct(opt,"o").toUpperCase();
                            const strike=num(opt,"k");
                            const key="OPT|"+pfId+"|"+cId+"|"+expiry+"|"+ot+"|"+strike;
                            if(seen.has(key))continue;
                            seen.add(key);

                            contractsOut.push({
                                type:"OPT",
                                pfCode,
                                pfId,
                                contractId:cId,
                                expiry,
                                strike,
                                optionType:ot,
                                price:num(opt,"p"),
                                delta:num(opt,"d"),
                                spanDelta:firstD(opt),
                                volatility:num(opt,"v"),
                                cvf:num(series,"cvf")??num(pf,"cvf")??1,
                                scaling:num(series,"sc")??num(pf,"sc")??1,
                                lotSize:lot(opt,pf,series,pfCode)||seriesLot,
                                risk:risk(opt)
                            });
                        }
                    }
                    doneGroups++;
                }
                progress();
                if(index+batchSize<optPfs.length){
                    setTimeout(()=>processOptions(index+batchSize),0);
                }else{
                    contracts=contractsOut;
                    if(onProgress)onProgress(100);
                    resolve();
                }
            };

            if(totalGroups===0){
                contracts=[];
                if(onProgress)onProgress(100);
                resolve();
                return;
            }

            if(onProgress)onProgress(35);
            processFutures(0);

        }catch(err){
            reject(err instanceof Error?err:new Error(String(err)));
        }
    });
}

function parseCSV(text){
 text=String(text||"").replace(/^\uFEFF/,"");const rows=[];let row=[],cell="",quoted=false;
 for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===","&&!quoted){row.push(cell);cell=""}else if((ch==="\n"||ch==="\r")&&!quoted){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);cell="";if(row.some(v=>String(v).trim()!==""))rows.push(row);row=[]}else cell+=ch}
 if(cell!==""||row.length){row.push(cell);if(row.some(v=>String(v).trim()!==""))rows.push(row)}
 if(rows.length<2)return[];const h=rows[0].map(x=>String(x).trim());return rows.slice(1).map(c=>{const o={};h.forEach((x,i)=>o[x]=String(c[i]??"").trim());return o})
}
function numberFromPosition(row,key){const v=String(row[key]??"").trim();if(!v)return 0;const n=Number(v.replace(/,/g,""));return Number.isFinite(n)?n:0}

function positionType(row){const t=firstPositionValue(row,["Inst","FinInstrmTp","Instrument","Instrument Type"]).toUpperCase();if(t==="STF"||t==="IDF"||t.includes("FUT")||t==="FUT")return"FUT";if(t==="STO"||t==="IDO"||t.includes("OPT")||t==="OPT")return"OPT";return""}
function normalizeOptionForSPN(v){v=String(v||"").trim().toUpperCase();return v==="CE"||v==="C"?"C":v==="PE"||v==="P"?"P":""}

function findSPANContractForPosition(row){
 const type=positionType(row),symbol=firstPositionValue(row,["Symbol","TckrSymb","Scrip","Scrip Name"]).trim().toUpperCase(),expiry=normalizeExpiry(firstPositionValue(row,["Expiry Date","XpryDt","Expiry","ExpiryDate"])),st=firstPositionValue(row,["Strike Price","StrkPric","Strike","StrikePrice"]).trim(),strike=st===""?null:Number(st),ot=normalizeOptionForSPN(firstPositionValue(row,["Opt Type","OptnTp","Option Type","OptionType"]));

 const box=document.getElementById("searchResults"),list=document.getElementById("resultList");box.classList.remove("hidden");list.innerHTML="";document.getElementById("searchCount").textContent=results.length.toLocaleString("en-IN")+" found";
 if(!results.length){list.innerHTML='<div class="empty">No matching contracts found.</div>';return}
 results.slice(0,100).forEach(c=>{const i=contracts.indexOf(c),lot=getDisplayLotSize(c),row=document.createElement("div");row.className="result";row.innerHTML=`<div class="result-type">${c.type}</div><div class="result-name">${escapeHtml(c.pfCode)}</div><div class="result-expiry">${formatExpiry(c.expiry)}</div><div>${c.type==="OPT"?formatNumber(c.strike):"-"}</div><div class="result-option">${c.type==="OPT"?(c.optionType==="C"?"CE":"PE"):"FUT"}</div><div class="mobile-hide">${c.price==null?"-":formatNumber(c.price)}</div><div class="result-add-controls"><select class="result-side" id="searchSide_${i}"><option value="Buy">Buy</option><option value="Sell">Sell</option></select><div class="lot-control"><input class="result-qty" id="searchQty_${i}" type="number" min="${lot}" step="${lot}" value="${lot}" title="1 lot = ${lot}"><div class="lot-stepper"><button type="button" class="lot-step-btn" onclick="adjustSearchLot(${i},${lot})" aria-label="Increase by 1 lot">▲</button><button type="button" class="lot-step-btn" onclick="adjustSearchLot(${i},-${lot})" aria-label="Decrease by 1 lot">▼</button></div></div><button class="add" onclick="directAdd(${i})">Add</button></div>`;list.appendChild(row)})
}
function adjustSearchLot(i,delta){
 const c=contracts[i];if(!c)return;
 const lot=getDisplayLotSize(c),el=document.getElementById("searchQty_"+i);if(!el)return;
 let q=Number(el.value)||lot;q=Math.max(lot,Math.round(q/lot)*lot+Number(delta));el.value=q;
}
function directAdd(i){
 const c=contracts[i];if(!c)return;const side=document.getElementById("searchSide_"+i).value,lot=getDisplayLotSize(c),qty=normalizeQtyToLot(document.getElementById("searchQty_"+i).value,lot);
 portfolio.push({contract:c,side,qty,price:side==="Sell"&&c.type==="OPT"?null:Number(c.price)});
 document.getElementById("searchResults").classList.add("hidden");renderPortfolio()
}
function stableBuildCalculation(){
 const area=document.getElementById("calculationArea");
 const sx=window.scrollX,sy=window.scrollY;
 const root=document.documentElement,body=document.body;
 const oldRootAnchor=root.style.overflowAnchor,oldBodyAnchor=body.style.overflowAnchor;
 const oldVisibility=area?area.style.visibility:"";
 root.style.overflowAnchor="none";
 body.style.overflowAnchor="none";
 if(area)area.style.visibility="hidden";
 buildCalculation();
 window.scrollTo(sx,sy);
 if(area)area.style.visibility=oldVisibility;
 requestAnimationFrame(()=>{
   window.scrollTo(sx,sy);
   root.style.overflowAnchor=oldRootAnchor;
   body.style.overflowAnchor=oldBodyAnchor;
 });
}

function adjustOutputLot(i,delta){
 const item=portfolio[i];if(!item)return;
 const lot=getDisplayLotSize(item.contract),el=document.getElementById("qty_"+i);if(!el)return;
 let q=Number(el.value)||lot;q=Math.max(lot,Math.round(q/lot)*lot+Number(delta));item.qty=q;el.value=q;
 stableBuildCalculation();
 const n=document.getElementById("qty_"+i);if(n)n.focus({preventScroll:true});
}
function removeContract(i){portfolio.splice(i,1);renderPortfolio()}
function clearPortfolio(){portfolio=[];renderPortfolio();document.getElementById("metricPositions").textContent="0";document.getElementById("metricGrossSpan").textContent="0";document.getElementById("metricHedge").textContent="0";document.getElementById("metricNetSpan").textContent="0"}
function clearSearch(){document.getElementById("expiry").value="";document.getElementById("strike").value="";document.getElementById("optionType").value="";document.getElementById("searchResults").classList.add("hidden")}
function changeSide(i,v){if(!portfolio[i])return;portfolio[i].side=v;const c=portfolio[i].contract;if(c.type==="OPT"&&v==="Sell")portfolio[i].price=null;else if(c.type==="OPT"&&v==="Buy"&&!Number.isFinite(Number(portfolio[i].price)))portfolio[i].price=Number(c.price);buildCalculation()}
function changeQty(i,v){if(!portfolio[i])return;portfolio[i].qty=normalizeQtyToLot(v,getDisplayLotSize(portfolio[i].contract));stableBuildCalculation()}
function updateMergedPrice(i,v){if(!portfolio[i])return;const n=Number(v);portfolio[i].price=Number.isFinite(n)&&n>=0?n:null;buildCalculation()}

/* Calendar spread */
function getRateValue(parent){const r=parent.querySelector(":scope > rate");if(!r)return 0;const v=r.querySelector(":scope > val");const n=Number((v?v.textContent:r.textContent).trim());return Number.isFinite(n)?n:0}
function readSpreadLeg(leg){if(!leg)return null;return{code:(directValue(leg,"cc")||directValue(leg,"pfCode")||directValue(leg,"pCode")||"").trim().toUpperCase(),expiry:normalizeExpiry(directValue(leg,"pe")||directValue(leg,"expiry")||""),ratio:Math.abs(Number(directNumber(leg,"i")??directNumber(leg,"qty")??directNumber(leg,"ratio")??1)||1)}}
function buildCalendarDeltaBook(){const m={};portfolio.forEach(x=>{const c=x.contract,code=String(c.pfCode||"").trim().toUpperCase(),expiry=normalizeExpiry(c.expiry),q=Math.max(0,Number(x.qty)||0);if(!code||!expiry||!q)return;const sq=x.side==="Buy"?q:-q,d=c.type==="FUT"?(Number.isFinite(Number(c.spanDelta))?Number(c.spanDelta):1):(Number(c.spanDelta)||0),k=code+"|"+expiry;if(!m[k])m[k]={key:k,code,expiry,delta:0};m[k].delta+=sq*d});return m}
function getCalendarSpreadDefinitions(){if(calendarSpreadDefinitions.length)return calendarSpreadDefinitions;if(!spanXML)return[];const out=[];spanXML.querySelectorAll("dSpread").forEach(ds=>{const legs=Array.from(ds.querySelectorAll(":scope > pLeg"));if(legs.length<2)return;const rate=getRateValue(ds);for(let i=0;i<legs.length-1;i++){let a=readSpreadLeg(legs[i]),b=readSpreadLeg(legs[i+1]);if(!a||!b||a.code!==b.code||a.expiry===b.expiry)continue;let near=a,far=b;if(Number(near.expiry)>Number(far.expiry))[near,far]=[far,near];out.push({code:near.code,keyNear:near.code+"|"+near.expiry,keyFar:far.code+"|"+far.expiry,near,far,rate,ratioNear:near.ratio,ratioFar:far.ratio})}});return out}
function calculateCalendarSpreadCharge(){if(portfolio.length<2)return{charge:0,details:[]};const mm=buildCalendarDeltaBook(),defs=getCalendarSpreadDefinitions(),rem={};Object.keys(mm).forEach(k=>rem[k]=mm[k].delta);let charge=0,details=[];defs.forEach(sp=>{const a=mm[sp.keyNear],b=mm[sp.keyFar];if(!a||!b)return;const qa=rem[sp.keyNear]||0,qb=rem[sp.keyFar]||0;if(Math.abs(qa)<1e-12||Math.abs(qb)<1e-12||Math.sign(qa)===Math.sign(qb))return;const u=Math.min(Math.abs(qa)/sp.ratioNear,Math.abs(qb)/sp.ratioFar);if(!Number.isFinite(u)||u<=0)return;rem[sp.keyNear]-=u*sp.ratioNear*Math.sign(qa);rem[sp.keyFar]-=u*sp.ratioFar*Math.sign(qb);const amt=u*sp.rate;charge+=amt;details.push({code:sp.code,expiryA:formatExpiry(sp.near.expiry),expiryB:formatExpiry(sp.far.expiry),amount:amt})});return{charge,details}}

function buildCalculation(){
 const head=document.getElementById("calculationHead"),body=document.getElementById("calculationBody");head.innerHTML=`<tr><th>#</th><th class="symbol-header">Symbol</th><th>Side</th><th>Qty</th><th>Price</th><th>SPAN</th><th>Remove</th></tr>`;body.innerHTML="";
 const csv=[],symbolGross={},symbolNOV={};let novAdj=0;
 portfolio.forEach(item=>{const c=item.contract,dir=item.side==="Buy"?1:-1,q=Math.max(0,Number(item.qty)||0),mult=(Number(c.cvf)||1)*(Number(c.scaling)||1),vals=[];for(let s=0;s<16;s++)vals.push(Number(c.risk[s]||0)*q*dir*mult);csv.push(vals);const standalone=Math.max(...vals,0),sym=String(c.pfCode||"").trim().toUpperCase();symbolGross[sym]=(symbolGross[sym]||0)+standalone;if(c.type==="OPT"){const prem=(Number(c.price)||0)*q*mult,nov=item.side==="Sell"?prem:-prem;novAdj+=nov;symbolNOV[sym]=(symbolNOV[sym]||0)+nov}});
 const groups={};portfolio.forEach((item,i)=>{const sym=String(item.contract.pfCode||"").trim().toUpperCase();if(!groups[sym])groups[sym]={key:sym,totals:new Array(16).fill(0),members:[]};groups[sym].members.push(i);for(let s=0;s<16;s++)groups[sym].totals[s]+=csv[i][s]});
 let scanning=0,groupWorst={};Object.values(groups).forEach(g=>{const w=Math.max(...g.totals),sc=g.totals.indexOf(w);groupWorst[g.key]={risk:Math.max(0,w),scenario:sc};scanning+=Math.max(0,w)});
 const spread=calculateCalendarSpreadCharge(),gross=csv.reduce((a,v)=>a+Math.max(...v,0),0),before=Math.max(0,scanning+spread.charge),hedge=Math.max(0,gross-before),finalSpan=Math.max(0,before+novAdj);
 let totalSpan=0;
 portfolio.forEach((item,i)=>{const c=item.contract,stand=Math.max(...csv[i],0),p=Number.isFinite(Number(item.price))?Number(item.price):"",lot=getDisplayLotSize(c);totalSpan+=stand;
 body.insertAdjacentHTML("beforeend",`<tr><td>${i+1}</td><td class="left"><b>${escapeHtml(c.pfCode)}</b> <span style="font-size:11px;color:#587068">${c.type==="OPT"?`${c.type} • ${formatExpiry(c.expiry)} • ${formatNumber(c.strike)} • ${c.optionType==="C"?"CE":"PE"}`:`${c.type} • ${formatExpiry(c.expiry)}`}</span></td><td><select class="side" onchange="changeSide(${i},this.value)"><option value="Buy" ${item.side==="Buy"?"selected":""}>Buy</option><option value="Sell" ${item.side==="Sell"?"selected":""}>Sell</option></select></td><td><div class="lot-control"><input id="qty_${i}" class="qty" type="number" min="${lot}" step="${lot}" value="${item.qty}" onchange="changeQty(${i},this.value)" title="1 lot = ${lot}"></div></td><td><input class="merged-price" type="number" min="0" step="0.01" value="${p}" onchange="updateMergedPrice(${i},this.value)"></td><td class="margin-value">${formatNumber(stand)}</td><td><button class="remove" onclick="removeContract(${i})">×</button></td></tr>`)});
 body.insertAdjacentHTML("beforeend",`<tr class="total-row"><td class="symbol-header"><b>Total</b></td><td></td><td></td><td></td><td></td><td class="margin-value"><b>${formatNumber(totalSpan)}</b></td><td></td></tr>`);
 document.getElementById("metricPositions").textContent=portfolio.length.toLocaleString("en-IN");
 document.getElementById("metricGrossSpan").textContent=""+formatNumber(gross);
 document.getElementById("metricHedge").textContent=""+formatNumber(hedge);
 document.getElementById("metricNetSpan").textContent=""+formatNumber(finalSpan);
 const rows=[];Object.keys(groups).sort().forEach(s=>{const g=symbolGross[s]||0,r=groupWorst[s]?.risk||0,sp=(spread.details||[]).filter(d=>String(d.code).toUpperCase()===s).reduce((a,d)=>a+Number(d.amount||0),0),sb=Math.max(0,r+sp),h=Math.max(0,g-sb),fs=Math.max(0,sb+(symbolNOV[s]||0));rows.push({symbol:s,gross:g,hedge:h,finalSpan:fs})});renderSymbolBreakdown(rows);
}
function renderSymbolBreakdown(rows){
 const box=document.getElementById("symbolBreakdown");
 if(!rows.length){box.innerHTML="";return}
 let tg=0,th=0,tf=0;
 const br=rows.map(r=>{tg+=r.gross;th+=r.hedge;tf+=r.finalSpan;return `<tr><td class="left"><b>${escapeHtml(r.symbol)}</b></td><td class="margin-value">${formatNumber(r.gross)}</td><td style="color:#087f5b;font-weight:900">-${formatNumber(r.hedge)}</td><td class="margin-value">${formatNumber(r.finalSpan)}</td></tr>`}).join("");
 box.innerHTML=`<div class="simple-margin-card"><div class="simple-margin-title"><span>Symbol-wise Hedge Benefit</span><span class="simple-margin-sub">Gross SPAN vs Hedge Benefit vs Net SPAN</span></div><div class="simple-margin-table-wrap"><table class="simple-margin-table"><thead><tr><th class="left">Symbol</th><th>Gross SPAN</th><th>Hedge Benefit</th><th>Net SPAN</th></tr></thead><tbody>${br}<tr class="grand-total-row"><td class="left"><b>All Symbols</b></td><td class="margin-value">${formatNumber(tg)}</td><td style="color:#087f5b;font-weight:900">-${formatNumber(th)}</td><td class="margin-value">${formatNumber(tf)}</td></tr></tbody></table></div></div>`;
}
document.getElementById("contractType").addEventListener("change",function(){const f=this.value==="FUT";document.getElementById("strike").disabled=f;document.getElementById("optionType").disabled=f;if(f){document.getElementById("strike").value="";document.getElementById("optionType").value=""}})
function clearPositionFile(){positionFileText="";positionRecords=[];positionMatched=[];positionUnmatched=[];positionClientIds=[];document.getElementById("positionFile").value="";document.getElementById("positionUploadedName").textContent="—";setPositionStatus("");clearPortfolio()}
function renderInitial(){renderPortfolio()}
renderInitial();
restoreSPANCache();
</script>
