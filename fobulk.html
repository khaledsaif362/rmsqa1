<!DOCTYPE html>
<html lang="en">
<head>
<script src="/KSH/rs-login-gate.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FO Bulk Random Generator</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:"Segoe UI",Arial,sans-serif;
  background:#f4f7f5;
  color:#216634;
  padding:10px;
}

.app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.header{
  height:48px;
  min-height:48px;
  background:green;
  border-radius:10px;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 20px;
  box-shadow:0 4px 12px rgba(24,77,43,.25);
  margin-top:12px;
}

.header h1{
  margin:0;
  font-size:16px;
  font-weight:900;
  letter-spacing:.4px;
  color:#fff;
  text-align:center;
}

.controls{
  background:#fff;
  border:1.5px solid #216634;
  border-radius:10px;
  padding:14px;
  display:grid;
  grid-template-columns:1fr 1.1fr 1.3fr 180px;
  gap:12px;
  box-shadow:0 4px 14px rgba(33,102,52,.08);
}

.card-section{
  background:#f5faf6;
  border:1.5px solid #216634;
  border-radius:8px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:3px;
  min-width:0;
}

.field label{
  font-size:9.5px;
  font-weight:900;
  letter-spacing:.25px;
  color:#216634;
  white-space:nowrap;
}

input[type=file]{
  width:100%;
  font-size:10px;
  font-weight:650;
  color:#216634;
  padding:2px 0;
}

input[type=number],
input[type=text],
select{
  width:100%;
  height:32px;
  min-width:0;
  border:1.5px solid #216634;
  border-radius:6px;
  background:#fff;
  padding:4px 9px;
  font-size:11px;
  font-weight:800;
  color:#216634;
  outline:none;
  transition:all .2s ease;
}

input[type=number]:focus,
input[type=text]:focus,
select:focus{
  border-color:#216634;
  box-shadow:0 0 0 3px rgba(33,102,52,.18);
}

.checks-wrapper{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.checks{
  height:32px;
  display:flex;
  align-items:center;
  gap:15px;
  padding:0 8px;
  border:1.5px solid #216634;
  border-radius:6px;
  background:#fff;
  white-space:nowrap;
  overflow:hidden;
}

.checks label{
  font-size:9.5px;
  font-weight:850;
  color:#184d2b;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
}

.checks input{
  width:13px;
  height:13px;
  accent-color:#216634;
  margin:0;
}

.actions-panel{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.btn-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

button{
  height:32px;
  border:0;
  border-radius:6px;
  padding:0 10px;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
  cursor:pointer;
  box-shadow:0 2px 4px rgba(33,102,52,.15);
  transition:all .15s ease;
  width:100%;
}

.primary{
  background:green;
  color:#fff;
}

.primary:hover{
  background:#184c26;
}

.clear-btn{
  background:#c0392b;
  color:#fff;
}

.clear-btn:hover{
  background:#962d22;
}

.status-bar{
  display:flex;
  gap:10px;
  align-items:center;
}

.status{
  flex:1;
  height:26px;
  min-height:26px;
  padding:5px 12px;
  border-radius:6px;
  background:#edf5ee;
  color:#216634;
  font-size:10px;
  font-weight:850;
  border:1.5px solid #216634;
}

.status.ok{
  background:#edf5ee;
  color:#216634;
  border-color:#216634;
}

.status.err{
  background:#fde8e8;
  color:#c0392b;
  border-color:#c0392b;
}

.info{
  background:#fff;
  border:1.5px solid #216634;
  padding:0 12px;
  height:26px;
  border-radius:6px;
  display:flex;
  align-items:center;
  min-width:0;
  font-size:10px;
  font-weight:900;
  color:#216634;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.output{
  flex:1;
  min-height:0;
  width:100%;
  background:#fff;
  border:1.5px solid #216634;
  border-radius:10px;
  overflow:auto;
  box-shadow:0 2px 10px rgba(33,102,52,.06);
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:10px;
}

th,
td{
  border:1.5px solid #c5dec9;
  padding:6px 8px;
  text-align:left;
  white-space:nowrap;
}

th{
  position:sticky;
  top:0;
  z-index:2;
  background:#216634;
  color:#fff;
  font-weight:900;
}

tr:nth-child(even){
  background:#f5faf6;
}

.empty{
  text-align:center;
  padding:45px;
  color:#216634;
  font-size:11px;
  font-weight:650;
}

@media(max-width:1200px){
  html,body{
    overflow:auto;
  }

  .app{
    height:auto;
    min-height:100%;
  }

  .controls{
    grid-template-columns:repeat(2,1fr);
  }

  .output{
    height:calc(100vh - 240px);
    flex:none;
  }
}


/* Compact upload controls */
.controls > .card-section:first-child{
  background:#f1fbf5;border:1px solid #39bd83;border-radius:7px;
  padding:7px;gap:5px;
}
.controls > .card-section:first-child > .field{
  background:#fff;border:1px solid #c6e8d3;border-radius:7px;
  padding:6px;gap:4px;
}
.controls > .card-section:first-child > .field:first-child{border-color:#91c9ff;}
.controls > .card-section:first-child > .field:nth-child(2){border-color:#d9a4ff;}
.controls > .card-section:first-child > .field:nth-child(3){border-color:#91c9ff;}
.controls > .card-section:first-child .field label{
  font-size:10px;font-weight:900;letter-spacing:0;white-space:normal;
}
.upload-topline{display:flex;align-items:center;gap:6px;min-width:0;}
#autoUpload{width:auto;flex:0 0 auto;height:29px;padding:0 10px;font-size:12px;font-weight:900;border-radius:6px;}
.auto-status{display:inline-block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;line-height:14px;font-weight:800;color:#087b54;}
.picked-file-name{display:block;flex:1;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:900;color:#087b54;line-height:20px;}
.file-pick-row{display:flex;align-items:center;gap:8px;min-width:0;}
.controls > .card-section:first-child input[type=file]{display:none;}
.choose-file-button{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-height:27px;padding:3px 9px;border:1px solid #bde5d0;border-radius:6px;background:#effaf3;color:#087b54;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;}
.choose-file-button:hover{background:#dff4e7;border-color:#8bcba8;}
.controls > .card-section:first-child .field label{font-size:12px;font-weight:900;color:#087b54;}
@media(max-width:1200px){
  html,body{overflow:auto}
  .app{height:auto;min-height:100%}
  .controls{grid-template-columns:repeat(2,1fr)}
  .output{height:calc(100vh - 240px);flex:none}
}

/* Unified sizing and typography across the entire generator */
:root{
  --green:#087b4f;
  --green-dark:#145b3a;
  --green-border:#80b99a;
  --green-soft:#f3faf5;
  --font-main:12px;
  --control-height:34px;
}
body{font-size:var(--font-main);color:var(--green-dark)}
.controls{
  padding:10px;
  gap:10px;
  grid-template-columns:minmax(300px,1.05fr) minmax(300px,1fr) minmax(360px,1.2fr) minmax(150px,.45fr);
  border:1px solid var(--green-border);
  border-radius:9px;
}
.card-section{
  min-width:0;
  padding:10px;
  gap:8px;
  border:1px solid var(--green-border);
  border-radius:8px;
  background:var(--green-soft);
}
.field{gap:4px}
.field label,
.checks label,
.checks-wrapper .field label{
  font-size:12px;
  line-height:16px;
  font-weight:800;
  letter-spacing:0;
  color:var(--green-dark);
}
input[type=number],input[type=text],select{
  height:34px;
  padding:5px 9px;
  border:1px solid var(--green-border);
  border-radius:6px;
  font-family:inherit;
  font-size:12px;
  line-height:18px;
  font-weight:800;
  color:var(--green-dark);
}
.checks{
  height:36px;
  min-height:36px;
  gap:12px;
  padding:0 9px;
  border:1px solid var(--green-border);
  border-radius:6px;
}
.checks label{gap:5px;white-space:nowrap}
.checks input{width:14px;height:14px;accent-color:var(--green);flex:0 0 auto}
button{
  height:34px;
  min-height:34px;
  padding:0 10px;
  border-radius:6px;
  font-family:inherit;
  font-size:12px;
  line-height:16px;
  font-weight:900;
}
.primary{background:var(--green)}
.primary:hover{background:#066b45}
.clear-btn{background:#c0392b}
.status-bar{gap:8px;margin-top:0}
.status,.info{
  min-height:30px;
  height:30px;
  display:flex;
  align-items:center;
  padding:5px 10px;
  border:1px solid var(--green-border);
  border-radius:6px;
  font-family:inherit;
  font-size:12px;
  line-height:16px;
  font-weight:800;
  color:var(--green-dark);
}
.status.ok{background:#edf8f0;border-color:var(--green-border);color:var(--green-dark)}
.info{background:#fff}
.output{border:1px solid var(--green-border);border-radius:8px}
table{font-family:inherit;font-size:12px}
th,td{padding:7px 9px;border-width:1px}
.empty{font-size:12px;font-weight:800;color:var(--green-dark)}
/* Upload cards use the same typography and control dimensions */
.controls > .card-section:first-child{
  padding:8px;
  gap:6px;
  border:1px solid #39bd83;
  border-radius:8px;
  background:#f3faf5;
}
.controls > .card-section:first-child > .field{
  padding:6px;
  gap:5px;
  border-radius:7px;
  background:#fff;
}
.controls > .card-section:first-child .field label{
  font-size:12px;
  line-height:16px;
  font-weight:900;
  color:var(--green);
}
#autoUpload{
  height:34px;
  min-height:34px;
  padding:0 10px;
  font-size:12px;
  line-height:16px;
}
.picked-file-name{
  font-size:12px;
  line-height:16px;
  font-weight:800;
  color:var(--green);
}
.auto-status{font-size:10px;line-height:13px;font-weight:800;color:var(--green);}
.file-pick-row{gap:8px}
.choose-file-button{
  min-height:30px;
  height:30px;
  padding:4px 9px;
  border:1px solid #b5ddc4;
  border-radius:6px;
  font-family:inherit;
  font-size:12px;
  line-height:16px;
  font-weight:800;
  color:var(--green);
}
@media(max-width:1200px){
  .controls{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
  .controls{grid-template-columns:minmax(0,1fr)}
  .status-bar{flex-direction:column;align-items:stretch}
  .status,.info{width:100%}
}



/* Final compact layout: reduce empty space and balance every panel */
body{padding:6px;background:#f4f8f5}
.controls{
  padding:7px;
  gap:7px;
  grid-template-columns:minmax(285px,1.02fr) minmax(285px,1fr) minmax(330px,1.18fr) minmax(165px,.48fr);
  align-items:stretch;
  margin:0;
}
.card-section{
  padding:8px;
  gap:6px;
  justify-content:flex-start;
}
.controls > .card-section:first-child{
  padding:6px;
  gap:5px;
}
.controls > .card-section:first-child > .field{
  padding:5px 6px;
  gap:3px;
}
.controls > .card-section:first-child .field label{
  font-size:12px;
  line-height:15px;
}
.upload-topline,.file-pick-row{gap:7px}
#autoUpload{height:31px;min-height:31px;padding:0 9px;font-size:12px}
.picked-file-name{font-size:12px;line-height:15px}.auto-status{font-size:10px;line-height:12px}
.choose-file-button{height:28px;min-height:28px;padding:3px 8px;font-size:12px}
.field{gap:3px}
input[type=number],input[type=text],select{height:31px;min-height:31px;padding:4px 8px}
.checks-wrapper{gap:4px}
.checks{height:32px;min-height:32px;gap:9px;padding:0 7px}
.checks label{font-size:11px;line-height:14px;gap:4px}
.checks input{width:13px;height:13px}
.actions-panel{
  justify-content:flex-start;
  gap:8px;
  padding:8px;
}
.actions-panel > .field[style*="visibility:hidden"]{display:none!important}
.actions-panel #generate{width:100%;height:32px;min-height:32px}
.btn-grid{grid-template-columns:1fr 1fr;gap:6px;margin-top:0}
.btn-grid button{height:31px;min-height:31px;padding:0 6px;font-size:11px}
.status-bar{gap:6px;margin-top:0}
.status,.info{height:27px;min-height:27px;padding:4px 8px;font-size:11px;line-height:14px}
.output{min-height:100px}
.empty{padding:28px 12px}
@media(max-width:1100px){
  html,body{height:auto;min-height:100%;overflow:auto}
  .controls{grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions-panel{display:grid;grid-template-columns:1fr 1fr;align-content:start;gap:7px}
  .actions-panel #generate{grid-column:1/-1}
  .output{height:calc(100vh - 240px);min-height:180px;flex:none}
}
@media(max-width:650px){
  .controls{grid-template-columns:minmax(0,1fr)}
  .actions-panel{display:flex}
  .status-bar{flex-direction:column;align-items:stretch}
  .status,.info{width:100%}
}


/* FINAL upload layout: status only beside Auto Upload; filenames only beside manual selectors */
.controls > .card-section:first-child{padding:6px;gap:5px;align-content:start}
.controls > .card-section:first-child > .field{padding:5px 7px;gap:4px;min-width:0}
.controls > .card-section:first-child > .field:first-child{padding:5px 7px}
.upload-topline{display:flex;align-items:center;gap:8px;min-width:0;min-height:30px}
#autoUpload{width:auto;flex:0 0 auto;height:30px;min-height:30px;padding:0 10px;font-size:12px;line-height:15px}
.auto-status{display:inline-block;flex:0 1 auto;min-width:0;max-width:95px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;line-height:12px;font-weight:800;color:#087b54}
.file-pick-row{display:flex;align-items:center;gap:8px;min-width:0}
.controls > .card-section:first-child input[type=file]{display:none}
.choose-file-button{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;height:28px;min-height:28px;padding:3px 9px;border:1px solid #bde5d0;border-radius:6px;background:#effaf3;color:#087b54;font-family:inherit;font-size:12px;line-height:15px;font-weight:800;cursor:pointer;white-space:nowrap}
.picked-file-name{display:block;flex:1 1 auto;min-width:0;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;line-height:15px;font-weight:800;color:#087b54}
.controls > .card-section:first-child .field label{font-size:12px;line-height:15px;font-weight:900;color:#087b54}


/* Keep each upload row on one horizontal line: title, picker, filename */
.controls > .card-section:first-child > .upload-inline-field{
  display:flex!important; flex-direction:row!important; align-items:center!important;
  gap:8px!important; min-width:0; flex-wrap:nowrap!important; padding:5px 7px!important;
}
.controls > .card-section:first-child > .upload-inline-field .inline-upload-title{
  display:block!important; flex:0 0 auto; width:auto; margin:0!important;
  white-space:nowrap; font-size:10px!important; line-height:13px!important;
  font-weight:900!important; color:#087b54!important;
}
.controls > .card-section:first-child > .upload-inline-field .file-pick-row{
  display:flex!important; flex:1 1 auto; flex-direction:row!important;
  align-items:center!important; gap:7px!important; min-width:0; flex-wrap:nowrap!important;
}
.controls > .card-section:first-child > .upload-inline-field .picked-file-name{
  flex:1 1 0; min-width:0; max-width:none; text-align:left;
  font-size:9px!important; line-height:12px!important; letter-spacing:-.15px;
}
@media(max-width:520px){
  .controls > .card-section:first-child > .upload-inline-field{gap:5px!important;padding:5px!important}
  .controls > .card-section:first-child > .upload-inline-field .inline-upload-title{font-size:10px!important}
  .controls > .card-section:first-child > .upload-inline-field .choose-file-button{font-size:10px;padding:3px 5px}
  .controls > .card-section:first-child > .upload-inline-field .picked-file-name{font-size:9px!important;letter-spacing:-.15px}
}

/* Smaller, lighter "Choose File" button (overrides earlier rules) */
.choose-file-button{
  font-size:10px!important;
  height:24px!important;
  min-height:24px!important;
  padding:2px 7px!important;
  font-weight:700!important;
  background:transparent!important;
  border:1px solid #cfe6d8!important;
  box-shadow:none!important;
}
.choose-file-button:hover{background:#f3faf5!important;border-color:#b5ddc4!important}

</style>
</head>

<body>

<div class="controls">

  <!-- Card 1: Data Sources -->
    <div class="card-section">
    <div class="field">
      <div class="upload-topline">
        <button type="button" id="autoUpload" class="primary">Auto Upload</button>
        <span id="autoStatus" class="auto-status" aria-live="polite"></span>
      </div>
    </div>
    <div class="field upload-inline-field" id="manualBhavcopyField">
      <label class="inline-upload-title" for="bhavcopy">NSE FO Bhavcopy</label>
      <div class="file-pick-row">
        <input id="bhavcopy" type="file" accept=".csv,.txt">
        <label class="choose-file-button" for="bhavcopy">Choose File</label>
        <span id="manualBhavcopyName" class="picked-file-name"></span>
      </div>
    </div>
    <div class="field upload-inline-field" id="clientListField">
      <label class="inline-upload-title" for="clientFile">Client List File</label>&nbsp;&nbsp;&nbsp;
      <div class="file-pick-row">
        <input id="clientFile" type="file" accept=".csv,.txt">
        <label class="choose-file-button" for="clientFile">Choose File</label>
        <span id="clientFileName" class="picked-file-name"></span>
      </div>
    </div>
    <div id="serverBhavcopyName" hidden></div>
  </div><!-- Card 2: Configuration -->
  <div class="card-section">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">

      <div class="field">
        <label>RECORDS</label>
        <input
          id="recordCount"
          type="number"
          min="1"
          value="100"
        >
      </div>

      <div class="field">
        <label>ORDER SIDE</label>

        <select id="side">
          <option value="RANDOM">BUY / SELL</option>
          <option value="BUY">BUY ONLY</option>
          <option value="SELL">SELL ONLY</option>
        </select>
      </div>

    </div>


    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">

      <div class="field">
        <label>CLIENT 1</label>

        <input
          id="client1"
          type="text"
          value="TEST001"
          placeholder="ID"
        >
      </div>

      <div class="field">
        <label>CLIENT 2</label>

        <input
          id="client2"
          type="text"
          placeholder="ID"
        >
      </div>

    </div>

  </div>


  <!-- Card 3: Filters -->
  <div class="card-section">

    <div class="checks-wrapper">

      <div class="field">
        <label>PRODUCTS</label>
      </div>

      <div class="checks" id="products">

        <label>
          <input
            type="checkbox"
            value="MARGIN"
            checked
          >
          MARGIN
        </label>

        <label>
          <input
            type="checkbox"
            value="INTRADAY"
            checked
          >
          INTRADAY
        </label>

      </div>


      <div class="field">
        <label>ORDER TYPES</label>
      </div>

      <div class="checks" id="orders">

        <label>
          <input
            type="checkbox"
            value="Limit"
            checked
          >
          LIMIT
        </label>

        <label>
          <input
            type="checkbox"
            value="Market"
            checked
          >
          MKT
        </label>

        <label>
          <input
            type="checkbox"
            value="SL"
            checked
          >
          SL
        </label>

        <label>
          <input
            type="checkbox"
            value="SL-M"
            checked
          >
          SL-M
        </label>

      </div>

    </div>

  </div>


  <!-- Card 4: Actions -->
  <div class="card-section actions-panel">

    <div
      class="field"
      style="visibility:hidden"
    >
      <label>&nbsp;</label>
    </div><br>

    <button
      id="generate"

/* =========================================================
   BHAVCOPY CACHE
   ========================================================= */

function bhavCacheOpen() {

  return new Promise((resolve, reject) => {

    try {

      const req =
        indexedDB.open(
          "foBulkBhavcopyCache",
          1
        );

      req.onupgradeneeded = function() {

        const db = req.result;

        if(!db.objectStoreNames.contains("kv")) {

          db.createObjectStore("kv");

        }

      };

      req.onsuccess = function() {

        resolve(req.result);

      };

      req.onerror = function() {

        reject(req.error);

      };

    }
    catch(e) {

      reject(e);

    }

  });

}


function bhavCacheGet(key) {

  return bhavCacheOpen()
    .then(function(db) {

      return new Promise(function(resolve) {

        const tx =
          db.transaction(
            "kv",
            "readonly"
          );

        const req =
          tx.objectStore("kv").get(key);

        req.onsuccess =
          function() {

            resolve(
              req.result || null
            );

          };

        req.onerror =
          function() {

            resolve(null);

          };

      });

    })
    .catch(function() {

      return null;

    });

}


async function bhavCacheSet(key,value) {
  try {
    const db = await bhavCacheOpen();
    const saved = await new Promise(function(resolve) {
      const tx = db.transaction("kv","readwrite");
      tx.objectStore("kv").put(value,key);
      tx.oncomplete = function(){ resolve(true); };
      tx.onerror = function(){ console.error("IndexedDB cache write failed",tx.error); resolve(false); };
      tx.onabort = function(){ console.error("IndexedDB cache write aborted",tx.error); resolve(false); };
    });
    if(!saved) return false;
    const check = await bhavCacheGet(key);
    return !!(check && check.name===value.name && Number(check.size||0)===Number(value.size||0) &&
      Array.isArray(check.contracts) && check.contracts.length===value.contracts.length);
  } catch(e) {
    console.error("IndexedDB cache save/verification failed",e);
    return false;
  }
}

/* =========================================================
   CSV PARSER
   ========================================================= */

function csvParse(text){

  text=String(text||"")
    .replace(/^\uFEFF/,"");

  let out=[];
  let row=[];
  let cell="";
  let q=false;

  for(let i=0;i<text.length;i++){

    let ch=text[i];

    if(q){

      if(ch==='"'){

        if(text[i+1]==='"'){
          cell+='"';
          i++;
        }else{
          q=false;
        }

      }else{

        cell+=ch;

      }

    }else if(ch==='"'){

      q=true;

    }else if(ch===','){

      row.push(cell);
      cell="";

    }else if(ch==='\n'){

      row.push(cell);

      if(row.some(v=>clean(v)!==""))
        out.push(row);

      row=[];
      cell="";

    }else if(ch!=='\r'){

      cell+=ch;

    }
  }


  if(cell!=="" || row.length){

    row.push(cell);

    if(row.some(v=>clean(v)!==""))
      out.push(row);

  }


  if(!out.length)
    return [];


  const h=out[0].map(clean);


  return out.slice(1).map(r=>{

    let o={};

    h.forEach((k,i)=>{
      o[k]=r[i]??"";
    });

    return o;

  });

}


/* =========================================================
   FUTURE / OPTION DETECTION
   ========================================================= */

function isFuture(r){

  let t=clean(r.FinInstrmTp).toUpperCase();

  if(t==="STF" || t==="IDF")
    return true;

  return clean(r.OptnTp).toUpperCase()==="FUT";
}


function isOption(r){

  let o=clean(r.OptnTp).toUpperCase();

  if(o==="CE" || o==="PE")
    return true;

  let t=clean(r.FinInstrmTp).toUpperCase();

  return t==="STO" || t==="IDO";
}


/* =========================================================
   READ CONTRACTS
   EXISTING LOGIC PRESERVED
   ========================================================= */

function readContracts(data){

  const need=[
    "FinInstrmTp",
    "TckrSymb",
    "FinInstrmNm",
    "XpryDt",
    "StrkPric",
    "OptnTp",
    "FinInstrmId",
    "ClsPric",
    "NewBrdLotQty"
  ];


  if(!data.length)
    throw Error("Bhavcopy is empty.");


  let miss=need.filter(
    k=>!(k in data[0])
  );


  if(miss.length)
    throw Error(
      "Invalid NSE Bhavcopy. Missing: "+
      miss.join(", ")
    );


  let seen=new Set();
  let a=[];


  for(const r of data){

    if(!(isFuture(r)||isOption(r)))
      continue;


    let id=clean(r.FinInstrmId);
    let name=clean(r.FinInstrmNm);

    let lot=num(r.NewBrdLotQty);
    let ltp=num(r.ClsPric);


    if(!id || !name || lot===null || ltp===null)
      continue;


    let key=id+"|"+name;


    if(seen.has(key))
      continue;


    seen.add(key);


    a.push({

      TckrSymb:
        clean(r.TckrSymb),

      FinInstrmNm:
        name,

      FinInstrmId:
        id,

      XpryDt:
        clean(r.XpryDt),

      StrkPric:
        num(r.StrkPric),

      OptnTp:
        isFuture(r)
          ? "FUT"
          : clean(r.OptnTp).toUpperCase(),

      ClsPric:
        ltp,

      NewBrdLotQty:
        lot

    });

  }


  return a;
}

/* =========================================================

   EXISTING LOGIC PRESERVED
   ========================================================= */

function randomOrders(list,n){

  const cls=clients();
  const ps=products();
  const ots=orderTypes();

  const requestedSide=$("side").value;


  if(!cls.length)
    throw Error(
      "Enter Client 1/2 or upload a Client CSV/TXT."
    );


  if(!ps.length)
    throw Error(
      "Select at least one Product."
    );


  if(!ots.length)
    throw Error(
      "Select at least one Order Type."
    );


  if(!list.length)
    throw Error(
      "No valid contracts available."
    );


  const sideMap=new Map();
  const result=[];


  for(let i=0;i<n;i++){

    const c=
      list[
        Math.floor(
          Math.random()*list.length
        )
      ];


    const cl=
      cls[
        Math.floor(
          Math.random()*cls.length
        )
      ];


    const key=
      cl+"|"+c.TckrSymb;


    let sd;


    if(requestedSide==="RANDOM"){

      if(!sideMap.has(key)){

        sideMap.set(
          key,
          Math.random()<.5
            ? "BUY"
            : "SELL"
        );

      }


      sd=sideMap.get(key);

    }else{

      sd=requestedSide;

    }


    const pr=
      ps[
        Math.floor(
          Math.random()*ps.length
        )
      ];


    const ot=
      ots[
        Math.floor(
          Math.random()*ots.length
        )
      ];


    result.push(
      order(
        c,
        cl,
        sd,
        pr,
        ot
      )
    );

  }


  return result;
}

});


async function loadServerBhavcopy(){

  try{

    msg(
      "Checking NSE FO Bhavcopy..."
    );


    /* =====================================================
       STEP 1
       Get only small Bhavcopy information
    ===================================================== */

    const infoResponse =
      await fetch(
        BHAVCOPY_INFO_API,
        {
          cache:"no-store"
        }
      );


    if(!infoResponse.ok){

      throw new Error(
        "Bhavcopy info server returned HTTP "+
        infoResponse.status
      );

    }


    const info =
      await infoResponse.json();


    const serverName =
      String(
        info.name || ""
      ).trim();


    if(!serverName){

      throw new Error(
        "Server did not return Bhavcopy filename."
      );

    }

    $("serverBhavcopyName").textContent = shortName(serverName);
    $("serverBhavcopyName").title = serverName;


    /* =====================================================
       STEP 2
       Check browser cache
    ===================================================== */

    const cached =
      await bhavCacheGet(
        "nseFoBhavcopy"
      );


    /* =====================================================
       SAME FILE FOUND IN CACHE
       Restore contracts directly.
       
       IMPORTANT:
       We do NOT parse the CSV again.
    ===================================================== */

    if(
      cached &&
      cached.name === serverName &&
      Number(cached.modifiedUnix || 0) === Number(info.modifiedUnix || 0) &&
      Number(cached.size || 0) === Number(info.size || 0) &&
      Array.isArray(cached.contracts) &&
      cached.contracts.length
    ){

      contracts =
        cached.contracts;


      const fu =
        Number(
          cached.futureCount || 0
        );


      const op =
        Number(
          cached.optionCount || 0
        );


      const rowCount =
        Number(
          cached.rowCount || 0
        );


      summary.textContent =
        rowCount.toLocaleString()+
        " rows • "+
        contracts.length.toLocaleString()+
        " contracts • "+
        fu+
        " FUT / "+
        op+
        " OPT";


      msg(
        "NSE FO Bhavcopy loaded from verified cache.",
        "ok"
      );


      return;

    }


    /* =====================================================
       STEP 3
       Bhavcopy changed or cache not available
    ===================================================== */

    msg(
      "New NSE FO Bhavcopy found. Loading..."
    );


    const response =
      await fetch(
        BHAVCOPY_API,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Server returned HTTP "+
        response.status
      );

    }


    /* =====================================================
       STEP 4
       Download full CSV
       ONLY when required
    ===================================================== */

    const csvText =
      await response.text();


    if(!csvText.trim()){

      throw new Error(
        "Bhavcopy returned empty."
      );

    }


    /* =====================================================
       STEP 5
       Existing CSV parser
       Calculation logic unchanged
    ===================================================== */

    const data =
      csvParse(csvText);


    contracts =
      readContracts(data);


    const fu =
      contracts.filter(
        isFuture
      ).length;


    const op =
      contracts.filter(
        isOption
      ).length;


    if(!fu || !op){

      throw new Error(
        "Bhavcopy must contain both Futures and Options."
      );

    }


    /* =====================================================
       STEP 6
       Show existing summary
    ===================================================== */

    summary.textContent =
      data.length.toLocaleString()+
      " rows • "+
      contracts.length.toLocaleString()+
      " contracts • "+
      fu+
      " FUT / "+
      op+
      " OPT";


    msg(
      "NSE FO Bhavcopy loaded",
      "ok"
    );


    /* =====================================================
       STEP 7
       SAVE PARSED CONTRACTS
       
       We intentionally cache CONTRACTS instead of the
       complete CSV because the generator only needs the
       contracts after readContracts().
       
       This makes next startup much faster.
    ===================================================== */

    const cacheSaved = await bhavCacheSet(
      "nseFoBhavcopy",
      {
        name: serverName,
        modifiedUnix: info.modifiedUnix || 0,
        size: info.size || 0,
        rowCount: data.length,
        futureCount: fu,
        optionCount: op,
        contracts: contracts
      }
    );
    if(!cacheSaved) {
      msg("NSE FO Bhavcopy loaded, but IndexedDB cache save could not be verified. Check browser storage permissions.","err");
      throw new Error("IndexedDB cache save failed or could not be verified.");
    }
    msg("NSE FO Bhavcopy loaded and cache save verified.","ok");


  }
  catch(e){

    contracts=[];


    summary.textContent =
      "Bhavcopy load failed.";


    msg(
      "? "+e.message,
      "err"
    );


    console.error(
      "NSE FO Bhavcopy error:",
      e
    );

  }

}

/* =========================================================
   GENERATE
   EXISTING 80% FUT / 20% OPT LOGIC
   ========================================================= */

$("generate").addEventListener(
  "click",
  ()=>{

    try{

      if(!contracts.length)
        throw Error(
          "Load Bhavcopy first."
        );


      const n=
        parseInt(
          $("recordCount").value,
          10
        );


      if(!Number.isInteger(n)||n<1)
        throw Error(
          "Enter a valid record count."
        );


      const cls=clients();


      if(!cls.length)
        throw Error(
          "Enter Client 1/2 or upload a Client CSV/TXT."
        );


      const fut=
        contracts.filter(
          isFuture
        );


      const opt=
        contracts.filter(
          isOption
        );


      if(!fut.length||!opt.length)
        throw Error(
          "Bhavcopy must contain both Futures and Options."
        );


      /* 80% FUTURE */
      const fn=
        Math.round(n*.80);


      /* Remaining 20% OPTIONS */
      const on=
        n-fn;


      const futureRows=
        randomOrders(
          fut,
          fn
        );


      const optionRows=
        randomOrders(
          opt,
          on
        );


      rowsOut=
        futureRows.concat(
          optionRows
        );


      /* Shuffle */
      for(
        let i=rowsOut.length-1;
        i>0;
        i--
      ){

        const j=
          Math.floor(
            Math.random()*(i+1)
          );


        [
          rowsOut[i],
          rowsOut[j]
        ]=[
          rowsOut[j],
          rowsOut[i]
        ];

      }


      render();


      summary.textContent=
        "Generated "+
        n.toLocaleString()+
        " rows • "+
        fn+
        " FUT / "+
        on+
        " OPT • "+
        cls.length+
        " Clients •";


      msg(
        "? Generated successfully",
        "ok"
      );


    }catch(e){

      msg(
        "? "+e.message,
        "err"
      );

    }

  }
);

    let u=
      URL.createObjectURL(
        new Blob(
          [
            "\uFEFF"+csv
          ],
          {
            type:
              "text/csv;charset=utf-8"
          }
        )
      );


    a.href=u;

    a.download=
      "NSE_FO_BULK_generated.csv";


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      ()=>URL.revokeObjectURL(u),
      1000
    );


    msg(
      "NSE_FO_BULK_generated.csv downloaded.",
      "ok"
    );

  }
);

    rowsOut=[];


    $("output").innerHTML=
      '<div class="empty">'+
      'Generated output will appear here.'+
      '</div>';


    $("summary").textContent=
      contracts.length
        ? "Bhavcopy loaded."
        : "No Bhavcopy loaded.";


    msg(contracts.length ? "Ready to generate again." : "", "");

  }
);

// BSE EQ-style upload controls and browser cache. Server is checked only on Auto Upload click.
$("autoUpload").addEventListener("click",async()=>{
 const btn=$("autoUpload"),st=$("autoStatus");btn.disabled=true;st.textContent="Checking";st.style.color="#087b54";
 try{await loadServerBhavcopy();const n=$("serverBhavcopyName")?.textContent||"NSE FO Bhavcopy";showPickedName("manualBhavcopyName",n);st.textContent="Success";st.style.color="#087b54";}
 catch(e){st.textContent="Failed";st.style.color="#c0392b";msg("Auto Upload failed: "+(e?.message||e),"err");}
 finally{btn.disabled=false;}
});

$("clientFile").addEventListener("change",async()=>{
 const f=$("clientFile").files?.[0];if(!f)return;$("client1").value="";showPickedName("clientFileName",f.name);
 try{const content=await f.text();const vals=content.replace(/\r/g,"").split(/[\n,\t;]+/).map(clean).filter(Boolean);
 fileClients=[...new Set(vals.filter(v=>!["CLIENT","CLIENTID","CLIENT ID","CLIENTCODE","CLIENT CODE"].includes(v.toUpperCase())))];
 if(!uploadCacheWrite(CLIENT_FILE_CACHE_KEY,{name:f.name,content,clients:fileClients})) throw new Error("Client list loaded, but cache save failed.");msg(fileClients.length+" client IDs loaded and cache save verified.","ok");}
 catch(e){msg("Could not read client list file.","err");}
});

$("bhavcopy").addEventListener("change",async()=>{
 const f=$("bhavcopy").files?.[0];if(!f)return;
 try{
   const content=await f.text();const data=csvParse(content);const parsed=readContracts(data);
   const fu=parsed.filter(isFuture).length, op=parsed.filter(isOption).length;
   if(!parsed.length||!fu||!op)throw new Error("Bhavcopy must contain valid Futures and Options.");
   const manualRecord={name:f.name,modifiedUnix:0,size:f.size||content.length,rowCount:data.length,futureCount:fu,optionCount:op,contracts:parsed};
   const saved=await bhavCacheSet("nseFoManualBhavcopy",manualRecord);
   if(!saved)throw new Error("Manual Bhavcopy parsed, but IndexedDB cache save could not be verified.");
   // Keep only lightweight metadata in localStorage; large contract arrays belong in IndexedDB.
   try{localStorage.removeItem(MANUAL_BHAVCOPY_CACHE_KEY);}catch(e){}
   contracts=parsed;showPickedName("manualBhavcopyName",f.name);$("autoStatus").textContent="";
   summary.textContent=data.length.toLocaleString()+" rows • "+parsed.length.toLocaleString()+" contracts • "+fu+" FUT / "+op+" OPT";
   msg("","");
 }catch(e){msg("Manual Bhavcopy failed: "+(e?.message||e),"err");}
});

window.addEventListener("load",async()=>{
 msg("","");
 let restored=false;
 try{
   const manual=await bhavCacheGet("nseFoManualBhavcopy");
   if(manual&&Array.isArray(manual.contracts)&&manual.contracts.length){
     contracts=manual.contracts;showPickedName("manualBhavcopyName",manual.name||"NSE FO Bhavcopy");
     summary.textContent=Number(manual.rowCount||0).toLocaleString()+" rows • "+contracts.length.toLocaleString()+" contracts • "+Number(manual.futureCount||0)+" FUT / "+Number(manual.optionCount||0)+" OPT";
     restored=true;
   }
 }catch(e){console.error("Manual NSE FO cache restore failed",e);}
 if(!restored){
   try{const cached=await bhavCacheGet("nseFoBhavcopy");if(cached&&Array.isArray(cached.contracts)&&cached.contracts.length){
     contracts=cached.contracts;showPickedName("manualBhavcopyName",cached.name||"NSE FO Bhavcopy");
     summary.textContent=Number(cached.rowCount||0).toLocaleString()+" rows • "+contracts.length.toLocaleString()+" contracts • "+Number(cached.futureCount||0)+" FUT / "+Number(cached.optionCount||0)+" OPT";

   }}catch(e){console.error("Server NSE FO cache restore failed",e);}
 }
 const cc=uploadCacheRead(CLIENT_FILE_CACHE_KEY);if(cc&&Array.isArray(cc.clients)){fileClients=cc.clients;$("client1").value="";showPickedName("clientFileName",cc.name||"Cached client list");$("clientFile").title=cc.name||"Cached client list";}
});
</script>
