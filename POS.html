<div class="card">

    <div class="window">
        <div class="title-bar">
            Position Files
        </div>
    </div>

    <div class="tab-bar" role="tablist">

        <button class="tab active"
                onclick="changeTab('FO',this)">
            FO
        </button>

        <button class="tab"
                onclick="changeTab('CD',this)">
            CD
        </button>

        <button class="tab"
                onclick="changeTab('MCX',this)">
            MCX
        </button>

        <button class="tab"
                onclick="changeTab('NCDEX',this)">
            NCDEX
        </button>

        <button class="tab"
                onclick="changeTab('NSECOM',this)">
            NSECOM
        </button>

    </div>

    <input type="hidden"
           id="positionType"
           value="FO">

    <div class="form-row">

        <label>
            Client Buy
        </label>

        <input type="text"
               id="client1">

    </div>

    <div class="form-row">

        <label>
            Client Sell
        </label>

        <input type="text"
               id="client2">

    </div>

    <div class="client-file-row" id="clientFileRow">

        <div style="display:flex;align-items:center;gap:10px;flex-wrap:nowrap;width:100%;">

            <label>
                Client List (txt/csv)&nbsp;&nbsp;
            </label>

            <div class="client-file-controls">

                <input type="file"
                       id="clientFile"
                       accept=".txt,.csv"
                       onchange="handleClientFileUpload(this)">

                <button type="button"
                        id="clientFileClearBtn"
                        style="display:none;"
                        onclick="clearClientFile()">
                    Clear
                </button>

            </div>

        </div>

        <div class="client-file-status" id="clientFileStatus">
        </div>

    </div>

    <div class="mode-toggle" id="modeToggle">

        <label class="mode-radio">
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <input type="radio"
                   name="posMode"
                   data-mode="sample"
                   checked
                   onchange="setMode('sample')">

            Sample Positions

        </label>

        <label class="mode-radio">

            <input type="radio"
                   name="posMode"
                   data-mode="manual"
                   onchange="setMode('manual')">

            Manual Entry

            <span class="manual-reopen"
                  id="manualReopen"
                  style="display:none;"
                  onclick="openManualPanel()">
            </span>

        </label>

        <label class="mode-radio">

            <input type="radio"
                   name="posMode"
                   data-mode="bulk"
                   onchange="setMode('bulk')">

            Bulk Generator

        </label>

    </div>

    <div class="form-row"
         id="commonExpiryRow">

        <label for="expiry"
               style="width:230px; white-space:nowrap;">

            NSE Expiry

        </label>

        <input type="date"
               id="expiry">

    </div>

    <div class="form-row"
         id="sensexBankexExpiryRow">

        <label for="sensexBankexExpiry"
               style="width:230px; white-space:nowrap;">

            BSE Expiry

        </label>

        <input type="date"
               id="sensexBankexExpiry">

    </div>

    <div id="symbolExpiryContainer"
         style="display:none;">
    </div>

    <div class="form-row"
         id="additionalStrikeRow">

        <label for="additionalStrikes"
               style="width:230px; white-space:nowrap;">

            Additional Strikes

        </label>

        <input type="number"
               id="additionalStrikes"
               min="0"
               value="0">

    </div>

    <div class="manual-drawer" id="bulkDrawer">

        <div class="manual-drawer-head">

            <strong>
                Bulk Position Generator
            </strong>

            <button type="button"
                    onclick="closeBulkDrawer()">
                Close
            </button>

        </div>

        <div class="manual-drawer-body">

            <div class="form-row">

                <label for="bulkBhavcopy">
                    Bhavcopy
                </label>

                <input type="file"
                       id="bulkBhavcopy"
                       accept=".csv"
                       onchange="handleBulkBhavcopy(this)">

            </div>

            <div id="bulkBhavcopyStatus"
                 style="font-size:12px;color:#2e7d32;margin:0 0 10px 112px;">
                No Bhavcopy selected
            </div>

            <div class="form-row">

                <label for="bulkClientFile">
                    Client File
                </label>

                <input type="file"
                       id="bulkClientFile"
                       accept=".txt,.csv"
                       onchange="handleBulkClientFile(this)">

            </div>

            <div id="bulkClientStatus"
                 style="font-size:12px;color:#2e7d32;margin:0 0 10px 112px;">
                No client list selected
            </div>

            <div class="form-row">

                <label for="bulkRecords">
                    Count
                </label>

                <input type="number"
                       id="bulkRecords"
                       min="1"
                       step="1"
                       placeholder="Enter number of positions">

            </div>

            <div class="button-group">

                <button type="button" onclick="generateBulk()">
                    Generate Bulk Positions
                </button>

                <button type="button" onclick="clearBulkInputs()">
                    Clear
                </button>

            </div>

        </div>

    </div>

    <div class="manual-drawer" id="manualDrawer">

        <div class="manual-drawer-head">

            <strong>
                Manual Scrips
            </strong>

            <button type="button"
                    onclick="closeManualDrawer()">
                Close
            </button>

        </div>

        <div class="manual-drawer-body">

           

            <div id="manualContainer">
            </div>

        </div>

    </div>

    <div id="checkboxContainer">
    </div>

    <div class="button-group">

        <button onclick="generate()">
            Download
        </button>

    </div>

</div>

<div class="footer">
    © Khaled
</div>

<script src="POS.js"></script>

</body>
</html>
