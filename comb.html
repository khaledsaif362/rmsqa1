<script>
'use strict';
const $=id=>document.getElementById(id), clean=v=>String(v??'').replace(/^\uFEFF/,'').trim(), num=v=>{let n=Number(clean(v).replace(/,/g,''));return clean(v)===''||!Number.isFinite(n)?null:n};
const HEAD=['','Exch','EXCH_SEG','SegmentCode','Symbol','ClientID','Buy/Sell','Token','Product','Qty','Price','OrdType','Trigger Price','DQty','Val','Pro/Cli','Participant ID','LTP'];
const API={NSEEQ:['http://172.16.101.74:8090/api/nse-eq-bhavcopy-info','http://172.16.101.74:8090/api/nse-eq-bhavcopy'],BSEEQ:['http://172.16.101.74:8090/api/bse-eq-bhavcopy-info','http://172.16.101.74:8090/api/bse-eq-bhavcopy'],NSEFO:['http://172.16.101.74:8090/api/nse-fo-bhavcopy-info','http://172.16.101.74:8090/api/nse-fo-bhavcopy'],BSEFO:['http://172.16.101.74:8090/api/bse-fo-bhavcopy-info','http://172.16.101.74:8090/api/bse-fo-bhavcopy']};
const DB_NAME='CombinedBulkGeneratorCache_v1', STORE='files';let books={},clientList=[],rowsOut=[];
function msg(t,c=''){ $('status').textContent=t;$('status').className='status '+c; }
function shortName(n){let s=String(n||'').trim(),m=s.match(/^(.*?\d{8})/);if(m)return m[1].replace(/[_.-]+$/g,'');let b=s.replace(/\.[^.]+$/,'');return b.length>32?b.slice(0,29)+'...':b}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function cacheGet(k){try{let db=await openDB();return await new Promise(resolve=>{let r=db.transaction(STORE,'readonly').objectStore(STORE).get(k);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null)})}catch(e){return null}}
async function cacheSet(k,v){let db=await openDB();await new Promise((resolve,reject)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v,k);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Cache write failed'));tx.onabort=()=>reject(tx.error||new Error('Cache write aborted'))});let check=await new Promise((resolve,reject)=>{let tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).get(k);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});db.close();if(!check)throw Error('Cache verification failed for '+k);return true}
function csvParse(text){text=String(text||'').replace(/^\uFEFF/,'');let out=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);if(row.some(v=>clean(v)!==''))out.push(row);row=[];cell=''}else if(ch!=='\r')cell+=ch}if(cell!==''||row.length){row.push(cell);if(row.some(v=>clean(v)!==''))out.push(row)}if(!out.length)return[];let h=out[0].map(clean);return out.slice(1).map(r=>{let o={};h.forEach((k,i)=>o[k]=r[i]??'');return o})}
function isFuture(r){let tp=clean(r.FinInstrmTp).toUpperCase(),nm=clean(r.FinInstrmNm).toUpperCase();return tp.includes('FUT')||nm.includes('FUT')||clean(r.OptnTp).toUpperCase()==='XX'}
function isOption(r){let tp=clean(r.FinInstrmTp).toUpperCase(),nm=clean(r.FinInstrmNm).toUpperCase(),op=clean(r.OptnTp).toUpperCase();return tp.includes('OPT')||nm.includes('OPT')||['CE','PE'].includes(op)}
function detectExchange(name,data){let n=String(name||'').toUpperCase(),first=data[0]||{},keys=Object.keys(first).map(k=>k.replace(/^\uFEFF/,'').trim().toUpperCase());/* Use exchange/file family before shared F&O-style column names: BSE CM files can contain FinInstrmTp too. */if(n.includes('BSE')&&(n.includes('_CM_')||n.includes('BSEEQ')||n.includes('BSE_EQ')))return'BSEEQ';if(n.includes('NSE')&&(n.includes('_CM_')||n.includes('NSEEQ')||n.includes('NSE_EQ')))return'NSEEQ';if(n.includes('BSE')&&(n.includes('BSEFO')||n.includes('_FO_')||n.includes('_FO.')))return'BSEFO';if((n.includes('NSE')||n.startsWith('NSCCL'))&&(n.includes('NSEFO')||n.includes('_FO_')||n.includes('_FO.')))return'NSEFO';if(keys.includes('SCTYSRS')){let series=data.map(r=>clean(r.SctySrs).toUpperCase());if(n.includes('BSE')&&series.includes('A'))return'BSEEQ';if((n.includes('NSE')||n.startsWith('NSCCL'))&&series.includes('EQ'))return'NSEEQ'}if(keys.includes('FININSTRMTP')||keys.includes('FININSTRMNM')||keys.includes('OPTNTP'))return n.includes('BSE')?'BSEFO':'NSEFO';if(n.includes('NSE')||n.startsWith('NSCCL'))return'NSEEQ';if(n.includes('BSE'))return'BSEEQ';return''}
function parseContracts(exchange,data){if(!data.length)throw Error('Bhavcopy is empty.');let a=[],seen=new Set();if(exchange==='NSEEQ'||exchange==='BSEEQ'){let need=['TckrSymb','SctySrs','OpnPric','FinInstrmId'],missing=need.filter(k=>!(k in data[0]));if(missing.length)throw Error('Missing columns: '+missing.join(', '));for(let r of data){let series=clean(r.SctySrs).toUpperCase();if(series!==(exchange==='NSEEQ'?'EQ':'A'))continue;let id=clean(r.FinInstrmId),sym=clean(r.TckrSymb),p=num(r.OpnPric);if(!id||!sym||p===null||p<300||p>4000)continue;let key=id+'|'+sym;if(seen.has(key))continue;seen.add(key);a.push({TckrSymb:sym,FinInstrmId:id,ClsPric:p,kind:'EQ'})}}else if(exchange==='NSEFO'){let need=['FinInstrmTp','TckrSymb','FinInstrmNm','XpryDt','StrkPric','OptnTp','FinInstrmId','ClsPric','NewBrdLotQty'],missing=need.filter(k=>!(k in data[0]));if(missing.length)throw Error('Missing columns: '+missing.join(', '));for(let r of data){if(!(isFuture(r)||isOption(r)))continue;let id=clean(r.FinInstrmId),sym=clean(r.TckrSymb).toUpperCase(),name=clean(r.FinInstrmNm),lot=num(r.NewBrdLotQty),ltp=num(r.ClsPric);if(!id||!name||!sym||lot===null||ltp===null)continue;let opt=isFuture(r)?'FUT':clean(r.OptnTp).toUpperCase();let strike=num(r.StrkPric),key=id+'|'+name+'|'+clean(r.XpryDt)+'|'+opt+'|'+(strike===null?'':strike);if(seen.has(key))continue;seen.add(key);a.push({...r,TckrSymb:sym,FinInstrmNm:name,FinInstrmId:id,XpryDt:clean(r.XpryDt),StrkPric:strike,OptnTp:opt,ClsPric:ltp,NewBrdLotQty:lot,kind:opt==='FUT'?'FUT':'OPT'})}}else{let need=['FinInstrmTp','TckrSymb','FinInstrmNm','XpryDt','StrkPric','OptnTp','FinInstrmId','ClsPric','NewBrdLotQty'],missing=need.filter(k=>!(k in data[0]));if(missing.length)throw Error('Missing columns: '+missing.join(', '));for(let r of data){if(!(isFuture(r)||isOption(r)))continue;let id=clean(r.FinInstrmId),name=clean(r.FinInstrmNm),sym=clean(r.TckrSymb).toUpperCase(),lot=num(r.NewBrdLotQty),ltp=num(r.ClsPric);if(!['SENSEX','BANKEX'].includes(sym)||!id||!name||lot===null||ltp===null)continue;let opt=isFuture(r)?'FUT':clean(r.OptnTp).toUpperCase(),strike=num(r.StrkPric),key=id+'|'+name+'|'+clean(r.XpryDt)+'|'+opt+'|'+(strike===null?'':strike);if(seen.has(key))continue;seen.add(key);a.push({...r,TckrSymb:sym,FinInstrmNm:name,FinInstrmId:id,XpryDt:clean(r.XpryDt),StrkPric:strike,OptnTp:opt,ClsPric:ltp,NewBrdLotQty:lot,kind:opt==='FUT'?'FUT':'OPT'})}}if(!a.length)throw Error('No valid contracts found for '+exchange+'.');return a}
async function loadText(exchange,text,name,manual=false){let data=csvParse(text),parsed=parseContracts(exchange,data);books[exchange]={name,text,rows:data.length,contracts:parsed,manual};await cacheSet('book_'+exchange,books[exchange]);return parsed.length}
async function fetchExchange(exchange){let [infoUrl,dataUrl]=API[exchange];let infoRes=await fetch(infoUrl,{cache:'no-store'});if(!infoRes.ok)throw Error(exchange+' info API HTTP '+infoRes.status);let info=await infoRes.json(),serverName=String(info.name||info.filename||info.fileName||'').trim();if(!serverName)throw Error(exchange+' server did not return a filename');let cached=await cacheGet('book_'+exchange);let hasMeta=info.modifiedUnix!==undefined&&info.size!==undefined;let same=!!(cached&&Array.isArray(cached.contracts)&&cached.contracts.length&&String(cached.name||'')===serverName&&(!hasMeta||(Number(cached.modifiedUnix)===Number(info.modifiedUnix)&&Number(cached.size)===Number(info.size))));if(same){books[exchange]=cached;return exchange+': cached '+shortName(serverName)}let res=await fetch(dataUrl,{cache:'no-store'});if(!res.ok)throw Error(exchange+' data API HTTP '+res.status);let text=await res.text();if(!text.trim())throw Error(exchange+' returned empty Bhavcopy');let count=await loadText(exchange,text,serverName,false);books[exchange].modifiedUnix=info.modifiedUnix;books[exchange].size=info.size;await cacheSet('book_'+exchange,books[exchange]);return exchange+': updated '+shortName(serverName)}
$('fetchAll').addEventListener('click',async()=>{let selected=[...document.querySelectorAll('#exchanges input:checked')].map(x=>x.value);if(!selected.length){msg('Select at least one exchange.','err');return}$('fetchAll').disabled=true;$('fetchStatus').textContent='Fetching selected Bhavcopies...';let results=[];for(let ex of selected){try{results.push('✓ '+await fetchExchange(ex))}catch(e){results.push('✗ '+ex+': '+e.message)}}$('fetchStatus').textContent=results.map(x=>x.startsWith('✓ ')?x.slice(2):x).join(' • ');$('fetchAll').disabled=false;refreshSummary();msg(results.some(x=>x.startsWith('✗'))?'Fetch failed for one or more exchanges.':'Bhavcopies ready. '+results.filter(x=>x.includes('cached')).length+' from cache.',''+(results.some(x=>x.startsWith('✗'))?'err':'ok'))});
$('manualFiles').addEventListener('change',async e=>{let files=[...(e.target.files||[])];if(!files.length)return;$('manualNames').textContent=files.length+' file(s) selected';$('manualNames').title=files.map(f=>f.name).join('\n');let results=[];for(let f of files){try{let text=await f.text(),data=csvParse(text),ex=detectExchange(f.name,data);if(!ex)throw Error('Could not detect exchange from filename/content. Name the file with NSE/BSE and EQ/FO.');let n=await loadText(ex,text,f.name,true);results.push('✓ '+f.name+' → '+ex+' ('+n+' contracts)')}catch(err){results.push('✗ '+f.name+': '+err.message)}}$('fetchStatus').textContent=results.map(x=>x.startsWith('✓ ')?x.slice(2):x).join(' • ');refreshSummary();msg(results.some(x=>x.startsWith('✗'))?'Manual upload completed with errors; see upload status.':'All selected Bhavcopy files loaded and cached.',results.some(x=>x.startsWith('✗'))?'err':'ok')});
$('clientFile').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{let text=await f.text(),vals=text.replace(/\r/g,'').split(/[\n,\t;]+/).map(clean).filter(Boolean);clientList=[...new Set(vals.filter(v=>!['CLIENT','CLIENTID','CLIENT ID','CLIENTCODE','CLIENT CODE'].includes(v.toUpperCase())))];await cacheSet('client_list',{name:f.name,text,clients:clientList});$('clientName').textContent=shortName(f.name);$('clientName').title=f.name;$('clientStatus').textContent=clientList.length+' client IDs loaded and cache save verified.';msg('Client list loaded and cached.','ok')}catch(err){msg('Could not load client list: '+err.message,'err')}});
function refreshSummary(){let a=Object.keys(books).map(ex=>ex+': '+books[ex].contracts.length.toLocaleString());$('summary').textContent=a.length?a.join(' • '):'No Bhavcopy loaded.'}
function getClients(){let a=[$('client1').value,$('client2').value,...clientList].map(clean).filter(Boolean);return [...new Set(a)]}
function checked(id){return [...document.querySelectorAll('#'+id+' input:checked')].map(x=>x.value)}
function bseSymbol(c){let s=clean(c.FinInstrmNm),sym=clean(c.TckrSymb),exp=clean(c.XpryDt),op=clean(c.OptnTp).toUpperCase(),strike=num(c.StrkPric);if(c.kind==='FUT')return s||sym;let d=new Date(exp),yy=String(d.getFullYear()).slice(-2),mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');let base=sym==='SENSEX'?'SENSEX':'BANKEX';return s||base+yy+mm+dd+(strike===null?'':String(strike))+op}
function makeOrder(ex,c,cl,side,prod,type){let close=Number(c.ClsPric),p=0,t=0;if(type==='Limit')p=close.toFixed(2);if(type==='SL'){p=close.toFixed(2);t=(side==='BUY'?close-2:close+2).toFixed(2)}if(type==='SL-M')t=(side==='BUY'?close-2:close+2).toFixed(2);let fo=ex.endsWith('FO'),bse=ex.startsWith('BSE'),segment=bse?(fo?'BSED':'BSEE'):(fo?'NSED':'NSEE'),segCode=fo?'D':'E',symbol=c.kind==='EQ'?(ex==='NSEEQ'?c.TckrSymb+'-EQ':c.TckrSymb):(bse?bseSymbol(c):(c.kind==='FUT'||c.kind==='OPT'?clean(c.FinInstrmNm):c.TckrSymb));let qty=fo?Number(c.NewBrdLotQty)||1:Math.floor(Math.random()*20)+1;return {'':'','Exch':bse?'BSE':'NSE','EXCH_SEG':segment,'SegmentCode':segCode,'Symbol':symbol,'ClientID':cl,'Buy/Sell':side,'Token':c.FinInstrmId,'Product':prod,'Qty':String(qty),'Price':p,'OrdType':type,'Trigger Price':t,'DQty':'0','Val':'DAY','Pro/Cli':'C','Participant ID':'','LTP':close.toFixed(2)}}
function chooseContracts(ex,all,n){if(!ex.endsWith('FO'))return all;let fut=all.filter(c=>c.kind==='FUT'),opt=all.filter(c=>c.kind==='OPT');if(!fut.length&&!opt.length)return all;let fN=Math.round(n*.8),oN=n-fN;let pick=(a,k)=>{let out=[];if(!a.length)return out;for(let i=0;i<k;i++)out.push(a[Math.floor(Math.random()*a.length)]);return out};return [...pick(fut,fN),...pick(opt,oN)]}
$('generate').addEventListener('click',()=>{try{let selected=[...document.querySelectorAll('#exchanges input:checked')].map(x=>x.value),n=parseInt($('recordCount').value,10),clients=getClients(),types=checked('orders'),side=$('side').value;if(!selected.length)throw Error('Select at least one exchange.');if(!Number.isInteger(n)||n<1)throw Error('Enter a valid record count.');if(!clients.length)throw Error('Enter Client 1 or Client 2, or upload a client list.');if(!types.length)throw Error('Select at least one order type.');let all=[];let base=Math.floor(n/selected.length),remainder=n%selected.length;for(let idx=0;idx<selected.length;idx++){let ex=selected[idx],exchangeCount=base+(idx<remainder?1:0);if(exchangeCount===0)continue;if(!books[ex]?.contracts?.length)throw Error('Bhavcopy is not loaded for '+ex+'. Fetch or manually upload it first.');let cs=books[ex].contracts,chosen=chooseContracts(ex,cs,exchangeCount);let products=checked(ex.endsWith('FO')?'foProducts':'eqProducts');if(!products.length)throw Error('Select products for '+(ex.endsWith('FO')?'FO':'Equity')+'.');for(let i=0;i<exchangeCount;i++){let c=chosen[i%chosen.length],cl=clients[Math.floor(Math.random()*clients.length)],sd=side==='RANDOM'?(Math.random()<.5?'BUY':'SELL'):side,prod=products[Math.floor(Math.random()*products.length)],type=types[Math.floor(Math.random()*types.length)];all.push(makeOrder(ex,c,cl,sd,prod,type))}}rowsOut=all;render();msg('Generated '+rowsOut.length.toLocaleString()+' orders across '+selected.length+' exchange(s), distributed as evenly as possible.','ok')}catch(e){msg(e.message,'err')}});
function render(){if(!rowsOut.length){$('output').innerHTML='<div class="empty">Generated output will appear here.</div>';return}let h='<table><thead><tr>'+HEAD.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>';for(let r of rowsOut)h+='<tr>'+HEAD.map(x=>'<td>'+esc(r[x]??'')+'</td>').join('')+'</tr>'; $('output').innerHTML=h+'</tbody></table>'}
function esc(v){return String(v).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
$('download').addEventListener('click',()=>{if(!rowsOut.length){msg('Generate orders first.','err');return}let csv=[HEAD.map(csvCell).join(','),...rowsOut.map(r=>HEAD.map(h=>csvCell(r[h]??'')).join(','))].join('\r\n'),blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Combined_Bulk_Orders.csv';a.click();URL.revokeObjectURL(url)});function csvCell(v){let s=String(v??'');return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
$('clear').addEventListener('click',()=>{rowsOut=[];render();msg('Output cleared. Loaded Bhavcopies and client cache are retained.','ok')});
window.addEventListener('load',async()=>{for(let ex of Object.keys(API)){let b=await cacheGet('book_'+ex);if(b?.contracts?.length)books[ex]=b}let c=await cacheGet('client_list');if(c?.clients){clientList=c.clients;$('clientName').textContent=shortName(c.name||'Cached client list');$('clientName').title=c.name||'';$('clientStatus').textContent=clientList.length+' cached client IDs restored.'}refreshSummary();if(Object.keys(books).length)msg('Cached Bhavcopies restored.','ok')});
</script></div></body></html>
