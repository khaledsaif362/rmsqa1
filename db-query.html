<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DB Query | RMS</title>
<style>
:root{
  --green:#287d32;--green-2:#2f9140;--deep:#24734d;--dark:#1c5c3d;--darker:#17492f;
  --bg:#e9edf1;--soft:#f1f7f2;--soft-2:#e6f2e9;--line:#d8e5db;--line-2:#c4d8c9;
  --ink:#14251b;--muted:#607066;--white:#fff;--danger:#b42318;--warn:#8a5a00;
  --radius:14px;--radius-sm:8px;
  --shadow:0 1px 2px rgba(20,60,35,.06),0 6px 20px rgba(25,70,40,.08);
  --ring:0 0 0 3px rgba(40,125,50,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:
  radial-gradient(900px 300px at 0% -10%,rgba(36,115,77,.10),transparent 60%),
  radial-gradient(700px 260px at 100% -10%,rgba(40,125,50,.08),transparent 60%),
  var(--bg);
  font:14px/1.5 "Segoe UI",Inter,Arial,sans-serif;color:var(--ink);font-weight:600;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:none;margin:0;padding:18px 22px}

/* page title (kept for compatibility) */
.page-title{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 16px}
.page-title h1{font-size:25px;color:var(--deep);margin:0;font-weight:800}
.subtitle{color:var(--muted);font-size:13px;font-weight:600;margin-top:3px}

/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:18px;overflow:hidden}
.card-title{margin:-18px -18px 16px;padding:12px 18px;background:linear-gradient(135deg,var(--deep) 0%,var(--green) 100%);color:#fff;font-size:15px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.card-title::before{content:"";width:8px;height:8px;border-radius:50%;background:#bff0c8;box-shadow:0 0 0 3px rgba(191,240,200,.25)}

/* connection bar */
.connection,.toolbar,.param-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.connection{padding:14px;background:var(--soft);border:1px solid var(--line);border-radius:12px}
.connection strong{color:#244a32;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.choice{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:8px 16px;cursor:pointer;transition:all .15s ease;user-select:none}
.choice:hover{border-color:#70b982;background:#f7fcf8}
.choice:has(input:checked){background:linear-gradient(135deg,#e3f2e6,#d3ecd9);border-color:#58a96c;color:#1c5f31;box-shadow:inset 0 0 0 1px rgba(40,125,50,.15)}
input[type=radio]{accent-color:var(--green);width:16px;height:16px;margin:0}

/* inputs */
input[type=password],input[type=text],select,textarea{height:42px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:#fff;color:var(--ink);font:inherit;min-width:0;transition:border-color .15s,box-shadow .15s}
input[type=password]:focus,input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:var(--ring)}
::placeholder{color:#93a399;font-weight:600}
select{cursor:pointer}
#password{margin-left:auto;width:250px}
#manualQuery{height:auto!important;padding:10px 12px!important;border:1px solid var(--line-2)!important;border-radius:10px!important;background:#fbfdfb}

/* buttons */
button{height:42px;padding:0 20px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--green-2),var(--green));color:#fff;font:inherit;font-weight:800;letter-spacing:.2px;cursor:pointer;box-shadow:0 2px 6px rgba(40,125,50,.28);transition:transform .08s ease,box-shadow .15s ease,filter .15s}
button:hover{filter:brightness(.93);box-shadow:0 4px 12px rgba(40,125,50,.32)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:none;box-shadow:var(--ring)}
button:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;filter:none;transform:none}
#connect:disabled{cursor:wait}
#run:disabled{cursor:wait}

/* status pill */
#status{font-size:12px;font-weight:800;border-radius:999px;padding:8px 14px;background:#e9f0ea;color:#52665a;overflow-wrap:anywhere;border:1px solid var(--line)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(320px,25%) minmax(0,1fr);gap:18px;align-items:start}
.filters{align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.filters::-webkit-scrollbar{width:8px}.filters::-webkit-scrollbar-thumb{background:#c4d8c9;border-radius:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11.5px;color:#355342;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.field select,.field input{width:100%}
.search-row{display:flex;gap:8px}
.search-row input{flex:1;min-width:0}
.search-row button{flex:0 0 auto;padding:0 16px}
.helper{font-size:12px;color:var(--muted);font-weight:600}
.query-preview{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f9f4;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:12px;font:12px/1.55 Consolas,"Cascadia Mono",monospace;color:#1f4a31;min-height:68px}

/* result header */
.result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.result-head h2{margin:0;color:var(--deep);font-size:18px;font-weight:800}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.secondary{background:#e5f1e7;color:#236d37;border:1px solid #bcd9c2;box-shadow:none}
.secondary:hover{background:#d5eadb;filter:none;box-shadow:none}
.count{font-size:12px;font-weight:800;color:#2a6a40;background:#e3f2e6;border:1px solid #c3dfca;padding:7px 14px;border-radius:999px}

/* tables */
.table-wrap{overflow:hidden;margin-top:14px;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(20,60,35,.05)}
table{border-collapse:collapse;width:100%;table-layout:fixed;min-width:0;margin:0}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #e3ece5;border-right:1px solid #e9f0ea;white-space:normal;overflow-wrap:anywhere;word-break:break-word;font-size:12px}
th:last-child,td:last-child{border-right:0}
th{background:linear-gradient(135deg,var(--deep),var(--green));color:#fff;text-transform:uppercase;font-weight:800;letter-spacing:.4px;position:sticky;top:0;border-right-color:rgba(255,255,255,.14)}
td{font-weight:700;color:#263b2d}
tbody tr:nth-child(even){background:#f5f9f5}
tbody tr:hover{background:#e6f3e9}
tbody tr:last-child td{border-bottom:0}

/* record cards (kept) */
.result-records{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.record{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;min-width:0}
.record-title{font-size:12px;font-weight:800;color:var(--deep);margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.record-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.record-field{min-width:0;background:#f5f9f5;border-radius:8px;padding:8px}
.record-field strong{display:block;font-size:10px;color:var(--muted);overflow-wrap:anywhere;margin-bottom:3px}
.record-field span{display:block;font-size:12px;color:var(--ink);overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap}

/* empty / error */
.empty{padding:28px 20px;background:repeating-linear-gradient(45deg,#f5f9f5,#f5f9f5 10px,#f1f7f2 10px,#f1f7f2 20px);border:1.5px dashed #bcd3c1;border-radius:12px;color:#43594a;font-weight:700;text-align:center}
.danger{color:var(--danger)!important;background:#fff5f4;border-color:#f0b9b3;border-style:solid}
.hidden{display:none!important}

/* responsive */
@media(max-width:1100px){.result-records{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:850px){
  main{padding:10px}
  .layout{grid-template-columns:1fr}
  .filters{position:static;max-height:none}
  .connection #password{margin-left:0;flex:1 1 180px;width:auto}
  .connection button{flex:1}
  .page-title h1{font-size:22px}
  .card{padding:14px}
  .card-title{margin:-14px -14px 14px;padding:11px 14px}
}
@media(max-width:760px){.result-records{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.result-records{grid-template-columns:1fr}}
th{font-size:10px;letter-spacing:.3px;padding:8px 10px}
.table-wrap{overflow-x:auto}
th.idx,td.idx{width:44px;min-width:44px;text-align:center;color:#6b7d72;background:#eef5ef}th.idx{color:#fff;background:#1c5c3d}
th{white-space:normal;word-break:normal;overflow-wrap:normal}
td{overflow-wrap:anywhere}
.kv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.kv{background:#f5f9f5;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.kv-k{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;overflow-wrap:normal}
.kv-v{font-size:13px;font-weight:700;color:var(--ink);overflow-wrap:anywhere;margin-top:3px;white-space:pre-wrap}
.kv-empty{color:#a3b3a8}
td,td.idx,.kv-v,.record-field span{font-weight:400!important}
th,.kv-k{font-weight:800}
th,th.idx{background:#dcefe0!important;color:#12402a!important;font-weight:800!important;font-size:11px!important;letter-spacing:.3px;border-bottom:2px solid #9fcaaa!important;border-right:1px solid #c4dccb!important;text-shadow:0 0 0 currentColor}
th.idx{background:#cfe6d4!important}
.kv-k{color:#1f5a3a;font-weight:800!important;background:none}
.kv{background:#f3f9f4}


/* Query Library: horizontal minimize only; keep the full sidebar width */
.filters .card-title{cursor:pointer;user-select:none}
.filters .card-title::after{content:"−";margin-left:auto;font-size:18px;line-height:1}
.filters.minimized .card-title::after{content:"+"}
.filters.minimized{width:48px;min-width:48px;padding:8px;overflow:hidden;align-self:start}
.layout:has(.filters.minimized){grid-template-columns:48px minmax(0,1fr)!important}
.filters.minimized{width:48px;min-width:48px;padding:8px;overflow:hidden;align-self:start}
.layout:has(.filters.minimized){grid-template-columns:48px minmax(0,1fr)!important}
.filters.minimized .library-content{display:none}
.filters.minimized .card-title{writing-mode:vertical-rl;transform:rotate(180deg);height:180px;min-height:180px;justify-content:center;gap:8px;padding:12px 8px;margin:-8px -8px 0;white-space:nowrap}
.filters.minimized .card-title::after{content:"+";margin:8px 0 0}
.filters.minimized .card-title{writing-mode:vertical-rl;transform:rotate(180deg);height:180px;min-height:180px;justify-content:center;gap:8px;padding:12px 8px;margin:-8px -8px 0;white-space:nowrap}
.filters.minimized .card-title::after{content:"+";margin:8px 0 0}
.ltp-checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:stretch;width:100%;min-width:0}.ltp-checks label{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;text-align:center;font-size:10px;line-height:1.25;font-weight:800;white-space:normal;overflow-wrap:anywhere;word-break:normal;min-width:0;padding:10px 4px;border:1px solid #d8e5db;border-radius:9px;background:#f7fbf8;cursor:pointer}.ltp-checks input{flex:0 0 auto;margin:0;width:17px;height:17px;accent-color:#287d32}
.query-actions{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:stretch}.query-actions button{min-height:42px;white-space:nowrap}.clear-button{background:#c62828!important;color:#fff!important;border:1px solid #b71c1c!important;font-weight:800}.clear-button:hover{background:#a91f1f!important}
#ltpValue{width:100%;height:42px;padding:10px 12px;border:1px solid #c7ddce;border-radius:10px;font:inherit;box-sizing:border-box;background:#fff;color:#173c28}
.query-preview{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.expiry-output-grid{display:block!important;width:100%}.expiry-box{display:block!important;width:100%;margin:10px 0}.expiry-section{display:block!important;clear:both;width:100%!important;max-width:100%;margin:12px 0!important;float:none!important}
.expiry-section .table-wrap{display:block!important;width:100%!important;max-width:100%;margin-bottom:10px}
.result-head .actions{align-items:stretch}
#rowCount,#download{height:42px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
#download{min-width:145px}

</style></head>

<div class="field"><label for="category">Category</label><select id="category"></select></div>


<div class="field"><label for="query">Query selector</label><select id="query"></select></div>
<div class="field hidden" id="manualField"><label for="manualQuery">Manual read-only query</label><textarea id="manualQuery" rows="5" placeholder="Example: SELECT * FROM USER_MASTER WHERE USER_ID = 'ABC'" style="width:100%;padding:10px;border:1px solid #cbd9ce;border-radius:6px;font:12px/1.5 Consolas,monospace;resize:vertical"></textarea><div class="helper">SELECT statements only. Data-changing queries are blocked.</div></div>
<div class="field" id="paramField"><label id="paramLabel" for="param">Parameter</label><input id="param" type="text" placeholder="Enter value"></div>
<div id="expiryFields" class="hidden">

</div>
<div style="height:12px"></div><div class="field" id="summaryField"><label>Query summary</label><div id="summary" class="query-preview"></div></div>
<div class="actions query-actions"><button id="run" type="button">Run Query</button><button id="clear" class="clear-button" type="button">Clear</button><button id="stop" class="secondary" type="button" disabled>Stop Query</button></div>

</div></aside>
<section class="card"><div class="result-head"><h2 id="resultTitle">Query Results</h2><div class="actions"><span class="count" id="rowCount">0 rows</span><button class="secondary" id="download" type="button" disabled>Download CSV</button></div></div>
<div id="results" class="empty" style="margin-top:12px">Connect to a database, select a query or enter a manual SELECT, then click Run Query.</div>
</section></div>

 else $("summary").textContent=q.s;

$("clear").addEventListener("click",()=>{
 if(activeController){activeController.abort();activeController=null;}
 ["querySearch","param","manualQuery","securityId","expiryDate","ltpScrip","ltpValue"].forEach(id=>{const el=$(id);if(el)el.value="";});
 ["updL1","updEq","updDrv"].forEach(id=>$(id).checked=false);
 $("category").value="";$("query").innerHTML='<option value="">Select query…</option>';
 $("searchHint").textContent="";$("summary").textContent="";$("results").className="empty";$("results").textContent="Cleared. Select a query to begin.";
 $("rowCount").textContent="0 rows";$("download").disabled=true;$("run").disabled=false;$("stop").disabled=true;
 lastRows=[];lastColumns=[];lastSQL="";updateQueryInfo();
});
$("stop").addEventListener("click",()=>{if(activeController){$("stop").disabled=true;$("results").textContent="Stopping query…";activeController.abort()}});
function showError(msg){$("results").className="empty danger";$("results").textContent=msg;$("rowCount").textContent="Error";$("download").disabled=true;lastRows=[];lastColumns=[]}
let lastData=null;
function renderExpiry(data){
 const sections=[...(data.after||[])];
 lastRows=[];lastColumns=[];
 $("download").disabled=true;
 $("results").className="";
 let out=`<div class="expiry-status" style="padding:12px 14px;border:1px solid #b9d9c1;border-radius:10px;background:#eff9f1;color:#205b34;font-weight:800;margin-bottom:14px">${esc(data.message||"Expiry update completed")}<div style="font-size:12px;font-weight:600;margin-top:5px">Updated at: ${esc(data.updated_at||"—")}</div></div>`;
 for(const section of sections){
  out+=`<div class="expiry-section" style="display:block;width:100%;margin:12px 0"><div style="font-size:14px;font-weight:800;color:#1c5c3d;margin:0 0 8px">${esc(section.title)}</div>`;
  const cols=section.columns||[],rows=section.rows||[];
  if(!rows.length){out+='<div class="empty">No matching rows found.</div>';}
  else{out+='<div class="table-wrap"><table><thead><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+cols.map(c=>`<td>${esc(row[c])}</td>`).join('')+'</tr>').join('')+'</tbody></table></div>';}
  out+='</div>';
 }
 $("results").innerHTML=out;
 $("rowCount").textContent=(data.updated?"Updated":"Completed");
 const allRows=[];
 sections.forEach(s=>(s.rows||[]).forEach(row=>allRows.push({section:s.title,...row})));
 lastRows=allRows;lastColumns=allRows.length?["section",...Object.keys(allRows[0]).filter(k=>k!=="section")]:[];
 $("download").disabled=!allRows.length;
}
function render(data){
 lastData=data;
 lastRows=data.rows||[];lastColumns=data.columns||[];
 const n=data.count??lastRows.length;
 $("rowCount").textContent=n+(n===1?" row":" rows");
 $("download").disabled=!lastRows.length;
 if(!lastColumns.length||!lastRows.length){$("results").className="empty";$("results").textContent="No data found for this query.";return}
 const cols=lastColumns, hdr=c=>esc(c).replace(/_/g,"_<wbr>");
 // Single record: show every field as a readable name/value grid.
 if(lastRows.length===1){
  const r=lastRows[0];
  $("results").className="";
  $("results").innerHTML="<div class='kv-grid'>"+cols.map(c=>{const v=esc(r[c]);return `<div class='kv'><div class='kv-k'>${hdr(c)}</div><div class='kv-v'>${v===""?"<span class='kv-empty'>—</span>":v}</div></div>`}).join("")+"</div>";
  return}
 // Many records: split columns into stacked tables sized to the page width so values stay readable.
 const w=$("results").clientWidth||1200, per=Math.max(5,Math.floor((w-60)/130));
 const chunk=a=>{const o=[];for(let i=0;i<a.length;i+=per)o.push(a.slice(i,i+per));return o};
 const splitAt=cols.findIndex(c=>String(c).toUpperCase()==="NC_COLLATERALS");
 const groups=splitAt>=0?[cols.slice(0,splitAt+1),...chunk(cols.slice(splitAt+1))]:chunk(cols);
 let html="";
 for(const group of groups){
  html+=`<div class='table-wrap'><table style='min-width:${(group.length+1)*105}px'><thead><tr><th class='idx'>#</th>`+group.map(c=>`<th>${hdr(c)}</th>`).join("")+"</tr></thead><tbody>";
  lastRows.forEach((row,i)=>{html+=`<tr><td class='idx'>${i+1}</td>`+group.map(c=>`<td>${esc(row[c])}</td>`).join("")+"</tr>"});
  html+="</tbody></table></div>";
 }
 $("results").className="";$("results").innerHTML=html;
}
let resizeT;window.addEventListener("resize",()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if(lastData&&lastRows.length>1)render(lastData)},200)});
$("download").addEventListener("click",()=>{if(!lastRows.length)return;const cell=v=>{let s=String(v??"");return '"'+s.replace(/"/g,'""')+'"'};const csv=[lastColumns.map(cell).join(","),...lastRows.map(r=>lastColumns.map(c=>cell(r[c])).join(","))].join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));a.download=(isExpiryUpdate()?"expiry-update":isManual()?"manual-query":currentQuery().id||"query")+".csv";a.click();URL.revokeObjectURL(a.href)});
$("param").addEventListener("keydown",e=>{if(e.key==="Enter")$("run").click()});fillCategories();autoConnect();
</script></body></html>
