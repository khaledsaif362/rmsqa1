<!DOCTYPE html>
<html lang="en">
<head>
<script src="/rs-login-gate.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bulk Orders</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7f5;
}

/* ==============================
   TOP BAR
============================== */

.bulk-topbar{
    width:100%;
    height:58px;
    min-height:58px;

    display:flex;
    align-items:center;

    background:#ffffff;

    border-bottom:2px solid #2e8b46;

    padding:0 16px;

    overflow:hidden;
}


/* ==============================
   TITLE
============================== */

.bulk-title{
    flex:0 0 auto;

    height:38px;

    padding:0 20px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#2e8b46;
    color:#ffffff;

    border-radius:6px;

    font-size:15px;
    font-weight:800;

    white-space:nowrap;

    margin-right:12px;

text-decoration:none;
cursor:pointer;
}


/* ==============================
   EXCHANGE AREA
============================== */

.bulk-tabs{
    display:flex;
    align-items:center;

    height:100%;

    gap:6px;

    overflow-x:auto;
    overflow-y:hidden;

    scrollbar-width:none;
}

.bulk-tabs::-webkit-scrollbar{
    display:none;
}


/* ==============================
   EXCHANGE BUTTON
============================== */

.bulk-tab{
    position:relative;

    flex:0 0 auto;

    height:36px;
    min-width:105px;

    padding:0 18px;

    border:1px solid #c9ddce;

    border-radius:6px;

    background:#f7faf8;

    color:#2e6940;

    font-size:12px;
    font-weight:800;

    cursor:pointer;

    white-space:nowrap;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:
        background .15s ease,
        color .15s ease,
        border-color .15s ease;
}


/* Hover */

.bulk-tab:hover{
    background:#e9f4ec;
    border-color:#2e8b46;
}





/* ==============================
   SELECTED EXCHANGE
============================== */

.bulk-tab.active{
    background:#176b30;

    color:#ffffff;

    border-color:#176b30;

    box-shadow:
        0 2px 5px rgba(0,0,0,.18);
}


/* Small selected indicator */

.bulk-tab.active::before{
    content:"";

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ffffff;

    margin-right:7px;
}


/* ==============================
   CONTENT
============================== */

.generator-area{
    width:100%;
    height:calc(100vh - 58px);

    padding:10px 14px 14px;

    overflow:hidden;
}

.generator-card{
    width:100%;
    height:100%;

    background:#ffffff;

    border:1px solid #d5e3d8;

    border-radius:8px;

    overflow:hidden;
}

#bulkGenerator{
    width:100%;
    height:100%;

    border:0;

    display:block;

    background:#ffffff;
}


/* ==============================
   MOBILE
============================== */

@media(max-width:700px){

    .bulk-topbar{
        height:54px;
        min-height:54px;

        padding:0 8px;
    }

    .bulk-title{
        height:34px;

        padding:0 12px;

        font-size:13px;

        margin-right:7px;
    }

    .bulk-tabs{
        gap:5px;
    }

    .bulk-tab{
        height:34px;

        min-width:88px;

        padding:0 12px;

        font-size:11px;
    }

    .generator-area{
        height:calc(100vh - 54px);

        padding:7px;
    }

}
</style>
</head>

<body>


<!-- =================================
     ONE LINE TOP BAR
================================= -->

<div class="bulk-topbar">

    <!-- TITLE -->
<!--
    <a
    class="bulk-title"
    href="comb.html"
    target="bulkGenerator">
    BULK ORDERS
</a>-->


    <!-- EXCHANGES -->

    <div class="bulk-tabs" id="bulkTabs">

        <button
            class="bulk-tab active"
            data-page="fobulk.html"
            onclick="openBulk(this)">
            NSE FO
        </button>

        <button
            class="bulk-tab"
            data-page="BSEFO.html"
            onclick="openBulk(this)">
            BSE FO
        </button>

        <button
            class="bulk-tab"
            data-page="NSEEQ.html"
            onclick="openBulk(this)">
            NSE EQ
        </button>

        <button
            class="bulk-tab"
            data-page="BSEEQ.html"
            onclick="openBulk(this)">
            BSE EQ
        </button>

        <!-- FUTURE -->

        <button
            class="bulk-tab"
            data-page="MCX.html"
            onclick="openBulk(this)">
            MCX
        </button>

        <button
            class="bulk-tab"
            data-page="CD.html"
            onclick="openBulk(this)">
            CD
        </button>

        <button
            class="bulk-tab"
            data-page="NCDEX.html"
            onclick="openBulk(this)">
            NCDEX
        </button>

    </div>

</div>


<!-- =================================
     GENERATOR CONTENT
================================= -->

<div class="generator-area">

    <div class="generator-card">

        <iframe
            id="bulkGenerator"
            name="bulkGenerator"
            src="fobulk.html">
        </iframe>

    </div>

</div>


<script>

function openBulk(button){

    /* Remove previous selection */

    document
        .querySelectorAll(".bulk-tab")
        .forEach(function(tab){
            tab.classList.remove("active");
        });


    /* Highlight selected */

    button.classList.add("active");


    /* Open page */

    document.getElementById("bulkGenerator").src =
        button.dataset.page;


    /* Keep selected tab visible */

    button.scrollIntoView({
        behavior:"smooth",
        block:"nearest",
        inline:"center"
    });
}

</script>

</body>
</html>
